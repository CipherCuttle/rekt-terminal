<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>REKT Inkubator — Product Coherence V1 Review</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#e5e7eb;overflow:hidden;font-family:ui-monospace,monospace}
#review{width:100%;height:100%;border:0;display:block;background:#e5e7eb}
.badge{position:fixed;z-index:99;right:14px;bottom:14px;padding:7px 9px;border:1px solid #c7cbd1;background:#fafbfce8;color:#555c68;font:9px/1.35 ui-monospace,monospace;letter-spacing:.06em;pointer-events:none;backdrop-filter:blur(4px)}
.badge b{color:#17191e}.badge i{display:inline-block;width:5px;height:5px;margin-right:6px;background:#ab195c;vertical-align:1px}
</style>
</head>
<body>
<iframe id="review" title="REKT Inkubator Product Coherence V1 static review fixture"></iframe>
<div class="badge"><i></i><b>PR71 STATIC REVIEW</b> / FIXTURE DATA / NO LIVE BACKEND</div>
<script>
const params=new URLSearchParams(location.search);
const mode=(params.get('mode')||'ship').toLowerCase();
const frame=document.getElementById('review');
frame.src=`../technical-faceplate-v1/index.html?mode=${encodeURIComponent(mode)}`;

frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const style=d.createElement('style');
  style.textContent=`
    :root{
      --page:#e5e7eb!important;
      --plate:#f3f4f6!important;
      --panel:#fafbfc!important;
      --recess:#e9ebef!important;
      --edge:#c7cbd1!important;
      --seam:#d7dbe0!important;
      --ink:#17191e!important;
      --muted:#555c68!important;
      --screen:#080a0e!important;
      --screen2:#0b0d11!important;
      --dt:#f0f1f3!important;
      --dm:#a8afb9!important;
      --orange:#ab195c!important;
      --cyan:#f0f1f3!important;
      --violet:#ff87bd!important;
      --green:#c1f85b!important;
      --red:#f0f1f3!important;
      --amber:#a8afb9!important;
    }
    html,body{background:#e5e7eb!important}
    .page{padding:18px!important}
    .machine{border-color:#c7cbd1!important;box-shadow:0 10px 22px #17191e0a,inset 0 1px #fff!important}
    .topbar,.surface-head,.statusbar,.printed,.workspace,.rail,.inspector{color:#17191e}
    .well{background:#080a0e!important;border-color:#c7cbd1!important;border-bottom-width:16px!important;border-radius:5px!important;box-shadow:inset 0 0 0 1px #303640,0 1px #fff!important}
    .well:after{opacity:.55}
    .rail button.active{border-left-color:#ab195c!important;background:#e9ebef!important}
    .statusbar .input i,.fixture i,.matrix i.hot{background:#ab195c!important;border-color:#ab195c!important}
    .surface-head h1 i,.inspector-top b{color:#ab195c!important}
    .row.selected{background:#20232d!important;box-shadow:inset 3px 0 #ff87bd!important}
    .row.selected .node i{background:#f0f1f3!important;border-color:#f0f1f3!important;box-shadow:none!important}
    .screen-truth,.tape .mark,.rx-core{color:#f0f1f3!important;border-color:#f0f1f3!important}
    .truth.observed i{background:#17191e!important}
    .truth.claimed i{background:#ab195c!important}
    .truth.proven,.screen-truth.proven,.verify-step.proven b,.verify-step.proven .n{color:#17191e!important}
    .truth.proven{background:#c1f85b!important}
    .screen-truth.proven,.verify-step.proven b,.verify-step.proven .n{color:#c1f85b!important}
    .purpose,.fixture,.micro,.surface-head .k,.statusbar,.printed .detail,.count,.ruler,.well-head .micro,.inspector-top,.dl dt,.boundary,.inspector-foot{color:#555c68}
    @media(max-width:700px){.page{padding:0!important}}
  `;
  d.head.appendChild(style);

  const brandStrong=d.querySelector('.brand strong');
  if(brandStrong) brandStrong.innerHTML='REKT<i>//</i>';
  const brandLabel=d.querySelector('.brand span');
  if(brandLabel) brandLabel.textContent='INKUBATOR';
  const purpose=d.querySelector('.purpose');
  if(purpose) purpose.innerHTML='PRODUCT COHERENCE / V1<br>DETAILED, NOT DECORATED.';
  const fixture=d.querySelector('.fixture');
  if(fixture) fixture.innerHTML='<i></i><b>STATIC REVIEW FIXTURE</b><small>PR #71 / NO LIVE DATA</small>';

  // Keep the review honest: this is a visual/interaction fixture, not a live product session.
  const foot=d.querySelector('.rail-imprint .micro');
  if(foot) foot.textContent='REKT / INKUBATOR\nREVIEW SERIES V1';
});
</script>
</body>
</html>
