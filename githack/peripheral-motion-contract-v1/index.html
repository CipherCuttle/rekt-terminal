*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:18px}.shell{max-width:980px;margin:auto}.head{display:flex;justify-content:space-between;gap:18px;align-items:start;margin-bottom:14px}.head h1{margin:4px 0 5px;font-size:clamp(18px,4vw,31px)}small{font-size:9px;letter-spacing:.12em;color:var(--muted)}p{font-size:11px;line-height:1.5;color:#5f5964;margin:0}.debug{border:1px solid var(--line);background:#fffdf8;padding:8px 10px;font-size:10px;white-space:nowrap}.stage{display:grid;grid-template-columns:1fr 280px;border:1px solid var(--line);background:#fffdf8}.screen{min-height:380px;display:grid;place-items:center;background:var(--screen);border-right:1px solid var(--line)}svg{width:min(78vw,520px);height:auto;overflow:visible}.fixed,.track,.toggle{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square;stroke-linejoin:miter}.fill{fill:currentColor;stroke:none}.ink{color:#f2eff8}.context{color:var(--context)}.observed{color:var(--observed)}.attention{color:var(--attention)}.blocked{color:var(--blocked)}.proven{color:var(--proven)}.stale{color:var(--stale)}.dbg{stroke:var(--debug);stroke-width:.7;fill:none;opacity:.7;stroke-dasharray:2 3}.read{padding:20px;display:flex;flex-direction:column;justify-content:center;gap:8px}.read strong{font-size:19px}.read span{font-size:10px;color:var(--muted);line-height:1.45}.read button,.bank button{font:inherit;background:#f9f6ef;color:var(--ink);border:1px solid #9f98a3;cursor:pointer}.read button{margin-top:8px;padding:11px;font-size:10px;font-weight:800}.roles{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-top:0;background:#fffdf8}.roles div{padding:11px;min-height:78px;border-right:1px solid #d4ced5}.roles div:last-child{border-right:0}.roles b{display:block;font-size:10px;line-height:1.45;margin-top:5px}.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10 <div class="shell"><div class="head"><div><small>REKT INK(CUBATOR) // INSTRUMENT OS</small><h1>PERIPHERAL MOTION CONTRACT V1</h1><p>Only declared TRACK layers move. FIXED anchors stay pinned. TOGGLE layers only appear/disappear.</p></div><label class="debug"><input id="debug" type="checkbox" checked> DEBUG TRACKS</label></div><div class="stage"><div class="screen"><svg id="svg" viewBox="0 0 160 96" shape-rendering="crispEdges"></svg></div><div class="read"><small>CURRENT CUE</small><strong id="title">SOURCE RX</strong><span id="meta"></span><button id="play">REPLAY NEW EVENT</button></div></div><div class="roles"><div><small>FIXED</small><b id="fixed"></b></div><div><small>TRACK</small><b id="moving"></b></div><div><small>TOGGLE</small><b id="toggle"></b></div></div><div class="bank" id="bank"></div><div class="foot"><span>MAGENTA = DEBUG-ONLY DECLARED PATH</span><span>INITIAL LOAD = SETTLED FRAME / NO AUTOPLAY</span></div></div>

const svg=document.getElementById('svg'),title=document.getElementById('title'),meta=document.getElementById('meta'),fixed=document.getElementById('fixed'),moving=document.getElementById('moving'),toggle=document.getElementById('toggle'),bank=document.getElementById('bank'),debug=document.getElementById('debug');let cue='SOURCE_RX',frame=3,token=0;
function el(tag,attrs={}){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
function shape(layer,pose){const [id,role,kind,a,,tone]=layer;if(!pose.v)return null;let n;if(kind==='circle')n=el('circle',{cx:a[0],cy:a[1],r:a[2]});if(kind==='rect')n=el('rect',{x:a[0],y:a[1],width:a[2],height:a[3]});if(kind==='line')n=el('line',{x1:a[0],y1:a[1],x2:a[2],y2:a[3],...(a[4]?{'stroke-dasharray':a[4]}:{})});if(kind==='path')n=el('path',{d:a[0]});if(kind==='poly')n=el('polygon',{points:a[0],class:'fill'});const g=el('g',{class:`${role} ${tone}`,transform:`translate(${pose.x} ${pose.y})`,'data-layer':id});g.append(n);return g}
function render(){const d=defs[cue];svg.replaceChildren();if(debug.checked){svg.append(el('path',{d:'M80 0v96M0 48h160',class:'dbg'}));svg.append(el('rect',{x:.5,y:.5,width:159,height:95,class:'dbg'}));d.l.filter(x=>x[1]==='track').forEach(x=>svg.append(el('polyline',{points:x[4].filter(p=>p.v).map(p=>`${p.x},${p.y}`).join(' '),class:'dbg'})))}d.l.forEach(l=>{const g=shape(l,l[4][frame]);if(g)svg.append(g)});title.textContent=d.label;meta.textContent=`${d.authority} // ${d.ms}MS // FRAME ${frame+1}/4`;fixed.textContent=d.l.filter(x=>x[1]==='fixed').map(x=>x[0]).join(' · ')||'NONE';moving.textContent=d.l.filter(x=>x[1]==='track').map(x=>x[0]).join(' · ')||'NONE';toggle.textContent=d.l.filter(x=>x[1]==='toggle').map(x=>x[0]).join(' · ')||'NONE';[...bank.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.cue===cue))}
async function play(){const t=++token, d=defs[cue];for(let i=0;i<4;i++){if(t!==token)return;frame=i;render();await new Promise(r=>setTimeout(r,d.ms/4))}frame=3;render()}
Object.entries(defs).forEach(([k,d])=>{const b=document.createElement('button');b.dataset.cue=k;b.innerHTML=`<b>${d.label}</b><span>${d.authority} · ${d.ms}ms</span>`;b.onclick=()=>{token++;cue=k;frame=3;render()};bank.append(b)});document.getElementById('play').onclick=play;debug.onchange=render;render();
