name: Phase 3 bounded review repair

on:
  push:
    branches:
      - 'feature/inkubator-player-mission-command-v0'
    paths:
      - '.github/workflows/phase3-review-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: rekt
          POSTGRES_PASSWORD: rekt_test
          POSTGRES_DB: rekt_inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekt -d rekt_inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekt:rekt_test@127.0.0.1:5432/rekt_inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
      INKUBATOR_DEV_AUTH: '1'
      NODE_ENV: test

    steps:
      - name: Check out exact repair parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify frozen parent lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'cdd3e37673cceee39cae1f7bab26a95b3e9870e4'
          test "$(git rev-parse HEAD^^)" = '8940765b9cb3f4f1a186c0733deca6924ba869fc'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'feature/inkubator-player-mission-command-v0'

      - name: Apply bounded P1 and contract repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/inkubator-api/src/mission-command.ts')
          source = path.read_text()

          gate_anchor = "    const gate = await transaction.selectFrom('mission_gates').selectAll().where('mission_id', '=', missionId).where('gate_key', '=', gateKey).executeTakeFirst();\n"
          gate_replacement = "    if (TERMINAL_STATES.has(mission.state)) throw new Error('mission_terminal');\n" + gate_anchor
          if source.count(gate_anchor) != 1:
              raise SystemExit(f'terminal gate anchor drifted: {source.count(gate_anchor)}')
          source = source.replace(gate_anchor, gate_replacement)

          blocker_anchor = "      blocker: snapshot.mission.blocker,\n"
          blocker_replacement = "      ...(snapshot.mission.blocker !== null ? {blocker: snapshot.mission.blocker} : {}),\n"
          if source.count(blocker_anchor) != 1:
              raise SystemExit(f'blocker serializer anchor drifted: {source.count(blocker_anchor)}')
          source = source.replace(blocker_anchor, blocker_replacement)
          path.write_text(source)
          PY

          cat > apps/inkubator-api/test/integration/phase3-review-regressions.test.mjs <<'EOF'
          import {randomUUID} from 'node:crypto';
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {buildApp} from '../../dist/app.js';
          import {createDatabase} from '../../dist/database.js';
          import {migrateToLatest} from '../../dist/migrations.js';

          const databaseUrl = process.env.DATABASE_URL;
          if (!databaseUrl) throw new Error('DATABASE_URL is required for integration tests');
          const appOrigin = process.env.INKUBATOR_APP_ORIGIN ?? 'http://127.0.0.1:4175';

          function cookieFrom(response) {
            const value = response.headers['set-cookie'];
            const serialized = Array.isArray(value) ? value[0] : value;
            assert.ok(serialized);
            return serialized.split(';')[0];
          }

          async function createSession(app, displayName) {
            const response = await app.inject({
              method: 'POST',
              url: '/v1/dev/session',
              headers: {origin: appOrigin},
              payload: {display_name: displayName},
            });
            assert.equal(response.statusCode, 201);
            return cookieFrom(response);
          }

          function mutationHeaders(cookie) {
            return {origin: appOrigin, cookie};
          }

          test('Phase 3 review regressions preserve terminal gates and Command blocker contract', async () => {
            const db = createDatabase(databaseUrl);
            await migrateToLatest(db);
            const app = buildApp({db, appOrigin, allowDevAuth: true, sessionTtlSeconds: 3600, github: null});

            try {
              const cookie = await createSession(app, `Phase3 Review ${randomUUID().slice(0, 8)}`);
              const rounds = await app.inject({method: 'GET', url: '/v1/rounds', headers: {cookie}});
              assert.equal(rounds.statusCode, 200);
              const founding = rounds.json().find((round) => round.code === 'ROUND_01');
              assert.ok(founding);

              const join = await app.inject({
                method: 'POST',
                url: `/v1/rounds/${founding.round_id}/join`,
                headers: mutationHeaders(cookie),
              });
              assert.equal(join.statusCode, 200);

              const declaration = await app.inject({
                method: 'POST',
                url: '/v1/missions',
                headers: mutationHeaders(cookie),
                payload: {
                  request_id: randomUUID(),
                  round_id: founding.round_id,
                  project_name: 'Phase 3 review repair',
                  goal: 'Preserve terminal integrity and generated Command contract',
                  ship_condition: 'Terminal gates become immutable and null blocker is omitted',
                  current_focus: 'Exercise bounded review regressions',
                  next_move: 'Claim gate then close Mission',
                },
              });
              assert.equal(declaration.statusCode, 201);
              const missionId = declaration.json().mission.mission_id;
              assert.equal(Object.hasOwn(declaration.json().mission, 'blocker'), false);

              const commandReload = await app.inject({method: 'GET', url: '/v1/me/command', headers: {cookie}});
              assert.equal(commandReload.statusCode, 200);
              assert.equal(Object.hasOwn(commandReload.json().mission, 'blocker'), false);

              const gateRequestId = randomUUID();
              const gateClaim = await app.inject({
                method: 'PATCH',
                url: `/v1/missions/${missionId}/gates/FOUNDATION`,
                headers: mutationHeaders(cookie),
                payload: {request_id: gateRequestId, state: 'CLAIMED'},
              });
              assert.equal(gateClaim.statusCode, 200);
              assert.equal(gateClaim.json().gates.find((gate) => gate.key === 'FOUNDATION').state, 'CLAIMED');

              const closeMission = await app.inject({
                method: 'PATCH',
                url: `/v1/missions/${missionId}`,
                headers: mutationHeaders(cookie),
                payload: {request_id: randomUUID(), state: 'CLOSED_NOT_SHIPPED'},
              });
              assert.equal(closeMission.statusCode, 200);
              assert.equal(closeMission.json().mission.state, 'CLOSED_NOT_SHIPPED');

              const idempotentGateRetry = await app.inject({
                method: 'PATCH',
                url: `/v1/missions/${missionId}/gates/FOUNDATION`,
                headers: mutationHeaders(cookie),
                payload: {request_id: gateRequestId, state: 'CLAIMED'},
              });
              assert.equal(idempotentGateRetry.statusCode, 200);
              assert.equal(idempotentGateRetry.json().gates.find((gate) => gate.key === 'FOUNDATION').state, 'CLAIMED');

              const forbiddenTerminalGateMutation = await app.inject({
                method: 'PATCH',
                url: `/v1/missions/${missionId}/gates/FOUNDATION`,
                headers: mutationHeaders(cookie),
                payload: {request_id: randomUUID(), state: 'ACTIVE'},
              });
              assert.equal(forbiddenTerminalGateMutation.statusCode, 409);
              assert.equal(forbiddenTerminalGateMutation.json().error, 'mission_terminal');

              const persistedGate = await db.selectFrom('mission_gates')
                .selectAll()
                .where('mission_id', '=', missionId)
                .where('gate_key', '=', 'FOUNDATION')
                .executeTakeFirstOrThrow();
              assert.equal(persistedGate.signal_state, 'CLAIMED');

              const gateHistoryCount = Number((await db.selectFrom('history_events')
                .select(({fn}) => fn.countAll().as('count'))
                .where('event_type', '=', 'mission.gate.updated')
                .where('subject_id', '=', missionId)
                .executeTakeFirstOrThrow()).count);
              assert.equal(gateHistoryCount, 1);
            } finally {
              await app.close();
              await db.destroy();
            }
          });
          EOF

          git diff --check

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify canonical toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v24.20.0'
          test "$(npm -v)" = '11.19.0'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build API
        run: npm run build -w @rekt-ink/inkubator-api

      - name: Apply migrations
        run: npm run migrate -w @rekt-ink/inkubator-api

      - name: Focused review regressions
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase3-review-regressions.test.mjs

      - name: API unit tests
        run: npm run test -w @rekt-ink/inkubator-api

      - name: Complete Postgres integration suite
        run: npm run test:integration -w @rekt-ink/inkubator-api

      - name: Generated client remains current
        run: npm run verify:client -w @rekt-ink/inkubator-api

      - name: Commit bounded repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase3-review-repair.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/inkubator-api/src/mission-command.ts apps/inkubator-api/test/integration/phase3-review-regressions.test.mjs .github/workflows/phase3-review-repair.yml
          git diff --cached --name-only | sort > /tmp/changed
          printf '%s\n' '.github/workflows/phase3-review-repair.yml' 'apps/inkubator-api/src/mission-command.ts' 'apps/inkubator-api/test/integration/phase3-review-regressions.test.mjs' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git commit -m 'fix(inkubator): preserve terminal Mission integrity'
          git push origin HEAD:feature/inkubator-player-mission-command-v0
