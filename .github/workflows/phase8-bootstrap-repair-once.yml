name: Phase 8 Bootstrap Repair Once

on:
  push:
    branches: [feature/inkubator-devkit-launch-surface-v0]
    paths:
      - '.github/workflows/phase8-bootstrap-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-devkit-launch-surface-v0
      - name: Repair nested generator template literal
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/phase8-devkit-bootstrap.yml')
          text = path.read_text()
          old = "headers.set('authorization', `Bearer ${this.accessToken}`)"
          new = "headers.set('authorization', 'Bearer ' + this.accessToken)"
          if old not in text:
              raise SystemExit('bootstrap authorization patch anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'CipherCuttle'
          git config user.email '97258089+CipherCuttle@users.noreply.github.com'
          git add .github/workflows/phase8-devkit-bootstrap.yml
          git commit -m 'ci(inkubator): fix DevKit transport generator escaping'
          git push origin HEAD:feature/inkubator-devkit-launch-surface-v0
