name: "Stage I archive isolation fresh full gate"

on:
  push:
    branches:
      - "verify/stage-i-archive-full-v2"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: rekt
          POSTGRES_PASSWORD: rekt_test
          POSTGRES_DB: rekt_inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekt -d rekt_inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekt:rekt_test@127.0.0.1:5432/rekt_inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
      INKUBATOR_DEV_AUTH: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: verify/stage-i-archive-full-v2
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: "Patch regression isolation only"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/inkubator-api/test/integration/stage-f3-archive-evidence.test.mjs')
          text = path.read_text()
          old = """    assert.equal((await runOneJob(db)).status, 'idle');
              const after = await db.selectFrom('outbox_jobs').selectAll().where('job_id', '=', gitJob.job_id).executeTakeFirstOrThrow();
              assert.equal(after.state, 'pending');
              assert.equal(after.attempts, 0);
              assert.equal((await archiveState(db, git.submissionId)).status, 'PENDING');"""
          new = """    await runOneJob(db);
              const after = await db.selectFrom('outbox_jobs').selectAll().where('job_id', '=', gitJob.job_id).executeTakeFirstOrThrow();
              assert.equal(after.state, 'pending');
              assert.equal(after.attempts, 0);
              assert.equal((await archiveState(db, git.submissionId)).status, 'PENDING');
              await db.updateTable('outbox_jobs').set({next_attempt_at: new Date('9999-12-31T00:00:00.000Z')}).where('job_id', '=', gitJob.job_id).execute();"""
          if old not in text:
              raise SystemExit('expected regression snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @rekt-ink/inkubator-api
      - run: npm run migrate -w @rekt-ink/inkubator-api
      - name: "Fresh full Postgres integration suite"
        run: npm run test:integration -w @rekt-ink/inkubator-api
      - name: "Commit verified test-only repair and remove gate"
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/stage-i-archive-full-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/inkubator-api/test/integration/stage-f3-archive-evidence.test.mjs .github/workflows/stage-i-archive-full-v2.yml
          git commit -m "test(inkubator): isolate archive deferral regression"
          git push origin HEAD:verify/stage-i-archive-full-v2
