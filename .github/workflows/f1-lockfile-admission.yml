name: F1 Lockfile Admission

on:
  push:
    branches:
      - foundation/inkubator-platform-f1-auth
    paths:
      - '.github/workflows/f1-lockfile-admission.yml'
      - 'apps/inkubator-api/package.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out dependency proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0

      - name: Verify canonical toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v24.20.0'
          test "$(npm -v)" = '11.19.0'

      - name: Generate dependency-lock proposal only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Stage lockfile as unreachable Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs'); process.stdout.write(JSON.stringify({content:fs.readFileSync('package-lock.json').toString('base64'),encoding:'base64'}))" > /tmp/blob.json
          response="$(curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary @/tmp/blob.json)"
          sha="$(node -e "const value=JSON.parse(process.argv[1]); if(!/^[0-9a-f]{40}$/.test(value.sha||'')) process.exit(1); process.stdout.write(value.sha)" "$response")"
          echo "F1_LOCKFILE_BLOB_SHA=$sha"

      - name: Upload lockfile proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1-package-lock-proposal
          path: package-lock.json
          if-no-files-found: error
