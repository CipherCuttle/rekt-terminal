name: Phase 2 final visual export

on:
  push:
    branches:
      - 'feature/inkubator-signal-system-v0'
    paths:
      - '.github/workflows/phase2-final-visual-export.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact repaired screenshots
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-signal-system-v0

      - name: Export repaired golden screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase2-final-golden-screens
          path: apps/inkubator-lab/e2e/__screenshots__/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-shot exporter
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase2-final-visual-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(inkubator): remove final visual exporter'
          git push origin HEAD:feature/inkubator-signal-system-v0
