name: Temporary Phase 5 closure publisher

on:
  push:
    branches: [tmp-phase5-closure-publish]
    paths: [.github/workflows/tmp-phase5-publish.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkubator
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: python3 .github/scripts/phase5-closure-contract-repair.py
      - run: npm run generate:client -w @rekt-ink/inkubator-api
      - run: npm run typecheck -w @rekt-ink/inkubator-api
      - run: node --test --test-concurrency=1 apps/inkubator-api/test/unit/phase5-contract-closure.test.mjs
      - run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-tester-moderation.test.mjs
      - run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-review-repair.test.mjs
      - run: npm run test -w @rekt-ink/inkubator-api
      - run: npm run test:integration -w @rekt-ink/inkubator-api
      - run: npm run verify:client -w @rekt-ink/inkubator-api
      - name: Publish clean temporary tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name CipherCuttle
          git config user.email 97258089+CipherCuttle@users.noreply.github.com
          git rm -f .github/scripts/phase5-closure-contract-repair.py .github/workflows/phase5-closure-contract-verify.yml .github/workflows/tmp-phase5-publish.yml
          git add apps/inkubator-api apps/inkubator-lab/src/generated/inkubator-api-client.ts
          git diff --cached --check
          git commit -m "fix(inkubator): complete Phase 5 closure contract repair"
          git push origin HEAD:tmp-phase5-closure-publish
