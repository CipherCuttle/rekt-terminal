name: Phase 5 community completion

on:
  push:
    branches:
      - feature/inkubator-multiplayer-help-loop-v0
    paths:
      - .github/scripts/phase5-community-completion.py
      - .github/workflows/phase5-community-completion.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - name: Verify lineage
        run: |
          git merge-base --is-ancestor e1261a5f12eae1ff9ff50b50c415a1c0e26e0772 HEAD
          git merge-base --is-ancestor 80738b92d40c328978bd3769483e4e64d0401d1c HEAD
      - run: npm ci
      - name: Apply Phase 5 completion patch
        run: python3 .github/scripts/phase5-community-completion.py
      - run: npm run generate:client -w @rekt-ink/inkubator-api
      - run: npm run typecheck -w @rekt-ink/inkubator-api
      - name: Focused Phase 5 community Postgres falsification
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-community-completion.test.mjs
      - name: Re-run Phase 5 core falsification
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-multiplayer-help-loop.test.mjs
      - run: npm run test -w @rekt-ink/inkubator-api
      - run: npm run test:integration -w @rekt-ink/inkubator-api
      - run: npm run verify:client -w @rekt-ink/inkubator-api
      - name: Commit product completion slice
        run: |
          git config user.name CipherCuttle
          git config user.email 97258089+CipherCuttle@users.noreply.github.com
          git add apps/inkubator-api apps/inkubator-lab/src/generated/inkubator-api-client.ts
          git diff --cached --check
          git commit -m "feat(inkubator): complete multiplayer community loop"
          git push origin HEAD:feature/inkubator-multiplayer-help-loop-v0
