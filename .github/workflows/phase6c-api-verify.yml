name: Phase 6C API Verification

on:
  pull_request:
    paths:
      - '.github/workflows/phase6c-api-verify.yml'
      - 'apps/inkubator-api/**'
      - 'apps/inkubator-lab/**'
      - 'packages/inkubator-protocol/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: rekt
          POSTGRES_PASSWORD: rekt_test
          POSTGRES_DB: rekt_inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekt -d rekt_inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekt:rekt_test@127.0.0.1:5432/rekt_inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
      INKUBATOR_DEV_AUTH: '1'
      NODE_ENV: test

    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify canonical toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v24.20.0'
          test "$(npm -v)" = '11.19.0'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: API typecheck and build
        run: |
          npm run typecheck -w @rekt-ink/inkubator-api
          npm run build -w @rekt-ink/inkubator-api

      - name: Generate and persist deterministic typed client
        run: |
          npm run generate:client -w @rekt-ink/inkubator-api
          npm run verify:client -w @rekt-ink/inkubator-api
          if ! git diff --quiet -- apps/inkubator-lab/src/generated/inkubator-api-client.ts; then
            git config user.name 'phase6c-verifier[bot]'
            git config user.email 'phase6c-verifier[bot]@users.noreply.github.com'
            git add apps/inkubator-lab/src/generated/inkubator-api-client.ts
            git commit -m 'build(inkubator): refresh Phase 6C typed client'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: API unit and protocol compatibility
        run: |
          npm run test -w @rekt-ink/inkubator-api
          npm run test -w @rekt-ink/inkubator-protocol

      - name: Lab Artifact tests and build
        run: |
          npm run test -w @rekt-ink/inkubator-lab -- --run src/signal-system/GoldenScreens.test.tsx
          npm run build -w @rekt-ink/inkubator-lab

      - name: Apply migrations
        run: npm run migrate -w @rekt-ink/inkubator-api

      - name: Focused Phase 6C plus Phase 6A/6B falsification
        run: >-
          timeout 120s node --test --test-concurrency=1
          apps/inkubator-api/test/integration/phase6-ship-artifact-attribution.test.mjs
          apps/inkubator-api/test/integration/phase6-ship-acceptance-receipt.test.mjs
          apps/inkubator-api/test/integration/phase6-ship-unavailable-truth.test.mjs
          apps/inkubator-api/test/integration/phase6-ship-reconciliation-starvation.test.mjs

      - name: Full Postgres integration after Phase 6C residue
        run: timeout 240s npm run test:integration -w @rekt-ink/inkubator-api
