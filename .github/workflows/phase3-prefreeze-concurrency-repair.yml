name: Phase 3 prefreeze concurrency repair

on:
  push:
    branches:
      - 'feature/inkubator-player-mission-command-v0'
    paths:
      - '.github/workflows/phase3-prefreeze-concurrency-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-player-mission-command-v0

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify canonical toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v24.20.0'
          test "$(npm -v)" = '11.19.0'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Serialize participant mutations and preserve retry receipts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/inkubator-api/src/mission-command.ts')
          text = path.read_text()

          profile_anchor = "  return db.transaction().execute(async (transaction) => {\n    if (await existingRequest(transaction, dedupeKey, 'player.profile.updated', playerId, 'player', playerId, payload)) {"
          profile_replacement = "  return db.transaction().execute(async (transaction) => {\n    await transaction.selectFrom('players').select('player_id').where('player_id', '=', playerId).forUpdate().executeTakeFirstOrThrow();\n    if (await existingRequest(transaction, dedupeKey, 'player.profile.updated', playerId, 'player', playerId, payload)) {"
          if text.count(profile_anchor) != 1:
              raise SystemExit(f'profile serialization anchor drifted: {text.count(profile_anchor)}')
          text = text.replace(profile_anchor, profile_replacement)

          create_anchor = "  return db.transaction().execute(async (transaction) => {\n    const existing = await transaction.selectFrom('missions').selectAll().where('creation_request_id', '=', requestId).executeTakeFirst();"
          create_replacement = "  return db.transaction().execute(async (transaction) => {\n    await transaction.selectFrom('players').select('player_id').where('player_id', '=', playerId).forUpdate().executeTakeFirstOrThrow();\n    const existing = await transaction.selectFrom('missions').selectAll().where('creation_request_id', '=', requestId).executeTakeFirst();"
          if text.count(create_anchor) != 1:
              raise SystemExit(f'createMission serialization anchor drifted: {text.count(create_anchor)}')
          text = text.replace(create_anchor, create_replacement)

          existing_start = "    if (existing) {\n      const project = await transaction.selectFrom('projects').selectAll().where('project_id', '=', existing.project_id).executeTakeFirstOrThrow();"
          membership_marker = "\n\n    const membership = await transaction.selectFrom('round_memberships as membership')"
          start = text.find(existing_start)
          if start < 0:
              raise SystemExit('createMission receipt start anchor drifted')
          end = text.find(membership_marker, start)
          if end < 0:
              raise SystemExit('createMission receipt end anchor drifted')
          replacement_block = """    if (existing) {
            const project = await transaction.selectFrom('projects').selectAll().where('project_id', '=', existing.project_id).executeTakeFirstOrThrow();
            const projectPayload = {schema_version: PROJECT_SCHEMA_VERSION, owner_player_id: playerId, name: projectName};
            const missionPayload = {
              schema_version: MISSION_SCHEMA_VERSION,
              creation_request_id: requestId,
              mission_id: existing.mission_id,
              owner_player_id: playerId,
              project_id: existing.project_id,
              round_id: roundId,
              goal,
              ship_condition: shipCondition,
              state: 'DECLARED',
              current_focus: currentFocus,
              next_move: nextMove,
              progress_model_version: PROGRESS_MODEL_VERSION,
              stack_labels: stackLabels,
              stack_source: stackLabels.length ? 'PLAYER_CONFIRMED' : 'UNKNOWN',
            };
            try {
              const projectReceiptMatches = await existingRequest(
                transaction,
                `activity:project.created:${project.project_id}`,
                'project.created',
                playerId,
                'project',
                project.project_id,
                projectPayload,
              );
              const missionReceiptMatches = await existingRequest(
                transaction,
                `activity:mission.declared:${existing.mission_id}`,
                'mission.declared',
                playerId,
                'mission',
                existing.mission_id,
                missionPayload,
              );
              if (!projectReceiptMatches || !missionReceiptMatches) throw new Error('mission_creation_idempotency_conflict');
            } catch (cause) {
              if (cause instanceof Error && cause.message.startsWith('history_event_idempotency_conflict:')) {
                throw new Error('mission_creation_idempotency_conflict');
              }
              throw cause;
            }
            const snapshot = await commandByMissionId(transaction, existing.mission_id);
            if (!snapshot) throw new Error('mission_creation_failed');
            return snapshot;
          }""".replace('          ', '')
          text = text[:start] + replacement_block + text[end:]

          mission_select = "const mission = await transaction.selectFrom('missions').selectAll().where('mission_id', '=', missionId).executeTakeFirst();"
          locked_select = "const mission = await transaction.selectFrom('missions').selectAll().where('mission_id', '=', missionId).forUpdate().executeTakeFirst();"
          if text.count(mission_select) != 2:
              raise SystemExit(f'Mission mutation lock anchor drifted: {text.count(mission_select)}')
          text = text.replace(mission_select, locked_select)

          path.write_text(text)
          PY

      - name: Add forced retry and concurrency regressions
        shell: bash
        run: |
          set -euo pipefail
          cat >> apps/inkubator-api/test/integration/phase3-player-mission-command.test.mjs <<'EOF'

          test('Phase 3 serializes first profile writes, Mission creation, and state transitions', async () => {
            const db = createDatabase(databaseUrl);
            await migrateToLatest(db);
            const app = buildApp({db, appOrigin, allowDevAuth: true, sessionTtlSeconds: 3600, github: null});
            try {
              const owner = await createSession(app, `Phase3 Race ${randomUUID().slice(0, 8)}`);

              const profilePayload = {
                request_id: randomUUID(),
                bio: 'Concurrency proof',
                character_name: 'Lockstep',
                character_archetype: 'BUILDER',
              };
              let releaseProfilePlayerLock;
              let profilePlayerLockReady;
              const profilePlayerRelease = new Promise((resolve) => { releaseProfilePlayerLock = resolve; });
              const profilePlayerReady = new Promise((resolve) => { profilePlayerLockReady = resolve; });
              const heldProfilePlayerLock = db.transaction().execute(async (transaction) => {
                await transaction.selectFrom('players').select('player_id').where('player_id', '=', owner.playerId).forUpdate().executeTakeFirstOrThrow();
                profilePlayerLockReady();
                await profilePlayerRelease;
              });
              await profilePlayerReady;
              const profileOnePromise = app.inject({method: 'PATCH', url: '/v1/me/profile', headers: mutationHeaders(owner.cookie), payload: profilePayload});
              const profileTwoPromise = app.inject({method: 'PATCH', url: '/v1/me/profile', headers: mutationHeaders(owner.cookie), payload: profilePayload});
              await new Promise((resolve) => setTimeout(resolve, 75));
              releaseProfilePlayerLock();
              await heldProfilePlayerLock;
              const [profileOne, profileTwo] = await Promise.all([profileOnePromise, profileTwoPromise]);
              assert.equal(profileOne.statusCode, 200);
              assert.equal(profileTwo.statusCode, 200);
              assert.deepEqual(profileOne.json(), profileTwo.json());
              const profileHistoryCount = Number((await db.selectFrom('history_events').select(({fn}) => fn.countAll().as('count')).where('dedupe_key', '=', `activity:player.profile.updated:${owner.playerId}:${profilePayload.request_id}`).executeTakeFirstOrThrow()).count);
              assert.equal(profileHistoryCount, 1);

              const rounds = await app.inject({method: 'GET', url: '/v1/rounds', headers: {cookie: owner.cookie}});
              const founding = rounds.json().find((round) => round.code === 'ROUND_01');
              assert.ok(founding);
              assert.equal((await app.inject({method: 'POST', url: `/v1/rounds/${founding.round_id}/join`, headers: mutationHeaders(owner.cookie)})).statusCode, 200);

              const declaration = {
                request_id: randomUUID(),
                round_id: founding.round_id,
                project_name: 'REKT Race Proof',
                goal: 'Serialize concurrent declaration',
                ship_condition: 'One durable Mission exists',
                current_focus: 'Race duplicate creation',
                next_move: 'Enter BUILDING',
              };

              let releaseCreatePlayerLock;
              let createPlayerLockReady;
              const createPlayerRelease = new Promise((resolve) => { releaseCreatePlayerLock = resolve; });
              const createPlayerReady = new Promise((resolve) => { createPlayerLockReady = resolve; });
              const heldCreatePlayerLock = db.transaction().execute(async (transaction) => {
                await transaction.selectFrom('players').select('player_id').where('player_id', '=', owner.playerId).forUpdate().executeTakeFirstOrThrow();
                createPlayerLockReady();
                await createPlayerRelease;
              });
              await createPlayerReady;
              const createOnePromise = app.inject({method: 'POST', url: '/v1/missions', headers: mutationHeaders(owner.cookie), payload: declaration});
              const createTwoPromise = app.inject({method: 'POST', url: '/v1/missions', headers: mutationHeaders(owner.cookie), payload: declaration});
              await new Promise((resolve) => setTimeout(resolve, 75));
              releaseCreatePlayerLock();
              await heldCreatePlayerLock;
              const [createOne, createTwo] = await Promise.all([createOnePromise, createTwoPromise]);
              assert.equal(createOne.statusCode, 201);
              assert.equal(createTwo.statusCode, 201);
              assert.equal(createOne.json().mission.mission_id, createTwo.json().mission.mission_id);
              assert.equal(createOne.json().project.project_id, createTwo.json().project.project_id);
              const missionId = createOne.json().mission.mission_id;
              const projectId = createOne.json().project.project_id;
              const creationCount = Number((await db.selectFrom('missions').select(({fn}) => fn.countAll().as('count')).where('creation_request_id', '=', declaration.request_id).executeTakeFirstOrThrow()).count);
              assert.equal(creationCount, 1);

              const building = await app.inject({method: 'PATCH', url: `/v1/missions/${missionId}`, headers: mutationHeaders(owner.cookie), payload: {
                request_id: randomUUID(), state: 'BUILDING', current_focus: 'Force a stale-read race', next_move: 'Serialize transition validation',
              }});
              assert.equal(building.statusCode, 200);

              const oldCreationRetry = await app.inject({method: 'POST', url: '/v1/missions', headers: mutationHeaders(owner.cookie), payload: declaration});
              assert.equal(oldCreationRetry.statusCode, 201);
              assert.equal(oldCreationRetry.json().mission.mission_id, missionId);
              assert.equal(oldCreationRetry.json().project.project_id, projectId);
              assert.equal(oldCreationRetry.json().mission.state, 'BUILDING');
              assert.equal(oldCreationRetry.json().mission.current_focus, 'Force a stale-read race');

              let releaseMissionLock;
              let missionLockReady;
              const missionRelease = new Promise((resolve) => { releaseMissionLock = resolve; });
              const missionReady = new Promise((resolve) => { missionLockReady = resolve; });
              const heldMissionLock = db.transaction().execute(async (transaction) => {
                await transaction.selectFrom('missions').select('mission_id').where('mission_id', '=', missionId).forUpdate().executeTakeFirstOrThrow();
                missionLockReady();
                await missionRelease;
              });
              await missionReady;
              const blockPromise = app.inject({method: 'PATCH', url: `/v1/missions/${missionId}`, headers: mutationHeaders(owner.cookie), payload: {
                request_id: randomUUID(), state: 'BLOCKED', blocker: 'Forced concurrency barrier', next_move: 'Resolve the barrier',
              }});
              await new Promise((resolve) => setTimeout(resolve, 75));
              const shipReadyPromise = app.inject({method: 'PATCH', url: `/v1/missions/${missionId}`, headers: mutationHeaders(owner.cookie), payload: {
                request_id: randomUUID(), state: 'SHIP_READY',
              }});
              await new Promise((resolve) => setTimeout(resolve, 75));
              releaseMissionLock();
              await heldMissionLock;
              const [blocked, shipReady] = await Promise.all([blockPromise, shipReadyPromise]);
              assert.equal(blocked.statusCode, 200);
              assert.equal(blocked.json().mission.state, 'BLOCKED');
              assert.equal(shipReady.statusCode, 409);
              assert.equal(shipReady.json().error, 'mission_transition_invalid');

              const finalCommand = await app.inject({method: 'GET', url: '/v1/me/command', headers: {cookie: owner.cookie}});
              assert.equal(finalCommand.statusCode, 200);
              assert.equal(finalCommand.json().mission.state, 'BLOCKED');
              assert.equal(finalCommand.json().mission.blocker, 'Forced concurrency barrier');
            } finally {
              await app.close();
              await db.destroy();
            }
          });
          EOF

      - name: Build and unit test API
        run: |
          npm run build -w @rekt-ink/inkubator-api
          npm run test -w @rekt-ink/inkubator-api

      - name: Apply migrations
        run: npm run migrate -w @rekt-ink/inkubator-api

      - name: Run complete Postgres integration suite
        run: npm run test:integration -w @rekt-ink/inkubator-api

      - name: Verify generated client remains current
        run: npm run verify:client -w @rekt-ink/inkubator-api

      - name: Commit verified prefreeze repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase3-prefreeze-concurrency-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(inkubator): serialize Phase 3 participant mutations'
          git push origin HEAD:feature/inkubator-player-mission-command-v0
