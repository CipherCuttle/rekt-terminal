name: Phase 5 help loop core

on:
  push:
    branches:
      - feature/inkubator-multiplayer-help-loop-v0
    paths:
      - .github/scripts/phase5-help-loop-core.py
      - .github/workflows/phase5-help-loop-core.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - name: Canonical npm
        run: npm install --global npm@11.19.0
      - name: Verify lineage and toolchain
        run: |
          test "$(git rev-parse HEAD^)" = "86bfbd5f9768598c99dba0099b82d22b667f49e4"
          test "$(git rev-parse HEAD^^)" = "e1261a5f12eae1ff9ff50b50c415a1c0e26e0772"
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - name: Install
        run: npm ci
      - name: Apply Phase 5 core
        run: python3 .github/scripts/phase5-help-loop-core.py
      - name: Generate typed client
        run: npm run generate:client -w @rekt-ink/inkubator-api
      - name: Typecheck API
        run: npm run typecheck -w @rekt-ink/inkubator-api
      - name: Focused Phase 5 Postgres falsification
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-multiplayer-help-loop.test.mjs
      - name: API unit tests
        run: npm run test -w @rekt-ink/inkubator-api
      - name: Complete Postgres integration
        run: npm run test:integration -w @rekt-ink/inkubator-api
      - name: Generated client current
        run: npm run verify:client -w @rekt-ink/inkubator-api
      - name: Commit product slice and self-delete harness
        run: |
          git config user.name "CipherCuttle"
          git config user.email "97258089+CipherCuttle@users.noreply.github.com"
          git rm -f .github/scripts/phase5-help-loop-core.py .github/workflows/phase5-help-loop-core.yml
          git add -A
          git diff --cached --check
          git commit -m "feat(inkubator): add multiplayer help loop core"
          git push origin HEAD:feature/inkubator-multiplayer-help-loop-v0
