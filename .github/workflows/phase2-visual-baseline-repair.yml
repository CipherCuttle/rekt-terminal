name: Phase 2 visual baseline repair

on:
  push:
    branches:
      - 'feature/inkubator-signal-system-v0'
    paths:
      - '.github/workflows/phase2-visual-baseline-repair.yml'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-signal-system-v0

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify canonical toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v24.20.0'
          test "$(npm -v)" = '11.19.0'

      - name: Install locked dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Regenerate distinct visual baselines
        run: npm run test:e2e -w @rekt-ink/inkubator-lab -- --update-snapshots

      - name: Prove five distinct screenshots and persist
        shell: bash
        run: |
          set -euo pipefail
          dir='apps/inkubator-lab/e2e/__screenshots__'
          test "$(find "$dir" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 5
          test "$(sha256sum "$dir"/*.png | awk '{print $1}' | sort -u | wc -l)" -eq 5
          git diff --check
          git rm .github/workflows/phase2-visual-baseline-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          git commit -m 'test(inkubator): repair distinct Phase-2 golden screenshots'
          git push origin HEAD:feature/inkubator-signal-system-v0
