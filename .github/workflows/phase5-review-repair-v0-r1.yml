name: Phase 5 review repair v0 r1

on:
  push:
    branches: [feature/inkubator-multiplayer-help-loop-v0]
    paths:
      - .github/workflows/phase5-review-repair-v0-r1.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkubator
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - name: Verify repair lineage and toolchain
        run: |
          git merge-base --is-ancestor 28abc81331a00958c5bd97980a03cde50d2b2b4c HEAD
          git merge-base --is-ancestor 91cb676495d4115a4f4c177d193a6f2286f369b0 HEAD
          git merge-base --is-ancestor e3ab10b076ae4c5586b475d3ea0d3e41e5d37806 HEAD
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: python3 .github/scripts/phase5-review-repair-v0.py
      - run: python3 .github/scripts/phase5-review-repair-compat-v0.py
      - run: npm run generate:client -w @rekt-ink/inkubator-api
      - run: npm run typecheck -w @rekt-ink/inkubator-api
      - name: Focused review-repair Postgres falsification
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-review-repair.test.mjs
      - name: Phase 5A regression
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-multiplayer-help-loop.test.mjs
      - name: Phase 5B1 regression
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-project-discussion-world.test.mjs
      - name: Phase 5B2 regression
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-tester-moderation.test.mjs
      - run: npm run test -w @rekt-ink/inkubator-api
      - run: npm run test:integration -w @rekt-ink/inkubator-api
      - run: npm run verify:client -w @rekt-ink/inkubator-api
      - name: Publish repaired product and self-delete all repair harnesses
        run: |
          git config user.name CipherCuttle
          git config user.email 97258089+CipherCuttle@users.noreply.github.com
          git rm -f .github/scripts/phase5-review-repair-v0.py .github/scripts/phase5-review-repair-compat-v0.py .github/workflows/phase5-review-repair-v0.yml .github/workflows/phase5-review-repair-v0-r1.yml
          git add apps/inkubator-api apps/inkubator-lab/src/generated/inkubator-api-client.ts
          git diff --cached --check
          git commit -m "fix(inkubator): repair Phase 5 review findings"
          git push origin HEAD:feature/inkubator-multiplayer-help-loop-v0
