name: Phase 4 targeted final repair

on:
  push:
    branches:
      - feature/inkubator-github-evidence-daemon-v0
    paths:
      - .github/scripts/phase4-targeted-final-repair.py
      - .github/workflows/phase4-targeted-final-repair.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - name: Canonical npm
        run: npm install --global npm@11.19.0
      - name: Verify lineage and toolchain
        run: |
          test "$(git rev-parse HEAD^)" = "f5fabbca8d3d0e67ce628ef62b2346d48cdfc94e"
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - name: Install
        run: npm ci
      - name: Apply final targeted repair
        run: python3 .github/scripts/phase4-targeted-final-repair.py
      - name: Generate typed client
        run: npm run generate:client -w @rekt-ink/inkubator-api
      - name: Typecheck API
        run: npm run typecheck -w @rekt-ink/inkubator-api
      - name: Focused Phase 4 Postgres falsification
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase4-github-evidence-daemon.test.mjs
      - name: API unit tests
        run: npm run test -w @rekt-ink/inkubator-api
      - name: Complete Postgres integration
        run: npm run test:integration -w @rekt-ink/inkubator-api
      - name: Generated client current
        run: npm run verify:client -w @rekt-ink/inkubator-api
      - name: Commit product repair and self-delete harness
        run: |
          git config user.name "CipherCuttle"
          git config user.email "97258089+CipherCuttle@users.noreply.github.com"
          git rm -f .github/scripts/phase4-targeted-final-repair.py .github/workflows/phase4-targeted-final-repair.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(inkubator): close Phase 4 targeted review defects"
          git push origin HEAD:feature/inkubator-github-evidence-daemon-v0
