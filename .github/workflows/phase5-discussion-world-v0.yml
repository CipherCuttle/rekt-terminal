name: Phase 5 discussion world v0

on:
  push:
    branches:
      - feature/inkubator-multiplayer-help-loop-v0
    paths:
      - .github/scripts/phase5-discussion-world-v0.py
      - .github/workflows/phase5-discussion-world-v0.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - name: Verify lineage and toolchain
        run: |
          test "$(git rev-parse HEAD^)" = "1f87ec1466f2044195c5304f049e61b457e40485"
          git merge-base --is-ancestor e1261a5f12eae1ff9ff50b50c415a1c0e26e0772 HEAD
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - name: Apply Phase 5B1 product patch
        run: python3 .github/scripts/phase5-discussion-world-v0.py
      - run: npm run generate:client -w @rekt-ink/inkubator-api
      - run: npm run typecheck -w @rekt-ink/inkubator-api
      - name: Focused Phase 5A truth regression
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-multiplayer-help-loop.test.mjs
      - name: Focused Phase 5B1 discussion/world falsification
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-project-discussion-world.test.mjs
      - run: npm run test -w @rekt-ink/inkubator-api
      - run: npm run test:integration -w @rekt-ink/inkubator-api
      - run: npm run verify:client -w @rekt-ink/inkubator-api
      - name: Commit product slice and self-delete harness
        run: |
          git config user.name CipherCuttle
          git config user.email 97258089+CipherCuttle@users.noreply.github.com
          git rm -f .github/scripts/phase5-discussion-world-v0.py .github/workflows/phase5-discussion-world-v0.yml
          git add apps/inkubator-api apps/inkubator-lab/src/generated/inkubator-api-client.ts
          git diff --cached --check
          git commit -m "feat(inkubator): add project discussion and world signals"
          git push origin HEAD:feature/inkubator-multiplayer-help-loop-v0
