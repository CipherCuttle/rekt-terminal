name: Phase 5 operator boundary repair

on:
  push:
    branches: [feature/inkubator-multiplayer-help-loop-v0]
    paths:
      - .github/workflows/phase5-operator-boundary-repair.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkubator
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24.20.0, cache: npm}
      - run: npm install --global npm@11.19.0
      - name: Verify repair lineage
        run: |
          test "$(git rev-parse HEAD^)" = "55089e7918843d87c05279d0e7ff166d175ba393"
          git merge-base --is-ancestor c8bcc7db98415e107ad7d01e0fdf4fd58e0ba6e6 HEAD
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - name: Apply bounded trust-boundary repair
        run: python3 .github/scripts/phase5-operator-boundary-repair.py
      - run: npm run generate:client -w @rekt-ink/inkubator-api
      - run: npm run typecheck -w @rekt-ink/inkubator-api
      - name: Phase 5A truth regression
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-multiplayer-help-loop.test.mjs
      - name: Phase 5B1 discussion/world regression
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-project-discussion-world.test.mjs
      - name: Phase 5B2 repaired tester/moderation falsification
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase5-tester-moderation.test.mjs
      - run: npm run test -w @rekt-ink/inkubator-api
      - run: npm run test:integration -w @rekt-ink/inkubator-api
      - run: npm run verify:client -w @rekt-ink/inkubator-api
      - name: Assert public operator surface absent
        run: |
          ! grep -R "'/v1/ops/comments" -n apps/inkubator-api/src apps/inkubator-api/test
          ! grep -R 'moderation_operators\|GLOBAL_MODERATION\|ModerationOperatorTable' -n apps/inkubator-api/src apps/inkubator-api/test
      - name: Publish repaired product files
        run: |
          git config user.name CipherCuttle
          git config user.email 97258089+CipherCuttle@users.noreply.github.com
          git add apps/inkubator-api apps/inkubator-lab/src/generated/inkubator-api-client.ts
          git diff --cached --check
          git commit -m "fix(inkubator): preserve operator trust boundary"
          git push origin HEAD:feature/inkubator-multiplayer-help-loop-v0
