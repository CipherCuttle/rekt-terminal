name: Instrument V2 Calibration

on:
  pull_request:
    paths:
      - 'apps/inkubator-lab/**'
      - '.github/workflows/inkubator-instrument-v2-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrument-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify canonical toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v24.20.0'
          test "$(npm -v)" = '11.19.0'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck Inkubator lab
        run: npm run typecheck -w @rekt-ink/inkubator-lab

      - name: Test Inkubator lab
        run: npm run test -w @rekt-ink/inkubator-lab

      - name: Build Inkubator lab
        run: npm run build -w @rekt-ink/inkubator-lab
