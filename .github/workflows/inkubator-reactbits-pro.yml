name: Inkubator React Bits Pro Build

on:
  push:
    branches:
      - concept/inkubator-reactbits-v1
      - concept/inkubator-dossier-polish-v2
      - feature/inkubator-protocol-v0
    paths:
      - ".github/workflows/inkubator-reactbits-pro.yml"
      - "apps/inkubator-lab/**"
      - "packages/inkubator-protocol/**"
      - "content/inkubator/**"
      - "scripts/inkubator/**"
      - "scripts/install-inkubator-reactbits-pro.mjs"
      - "scripts/check-inkubator-budgets.mjs"
      - "scripts/check-inkubator-lighthouse.mjs"
      - "scripts/serve-inkubator.mjs"
  workflow_dispatch:

concurrency:
  group: inkubator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    env:
      REACTBITS_LICENSE_KEY: ${{ secrets.REACTBITS_LICENSE_KEY }}

    steps:
      - name: Check out isolated Inkubator branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require React Bits license secret
        shell: bash
        run: |
          if [ -z "$REACTBITS_LICENSE_KEY" ]; then
            echo "::error::Missing repository secret REACTBITS_LICENSE_KEY"
            exit 1
          fi

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch licensed React Bits Pro components
        working-directory: apps/inkubator-lab
        run: npx --yes shadcn@latest add @reactbits-starter/glitch-text-css @reactbits-starter/dither-wave-css @reactbits-starter/grain-wave-css @reactbits-starter/squircle-shift-css --yes

      - name: Wire the installed components into Inkubator
        run: node scripts/install-inkubator-reactbits-pro.mjs

      - name: Install React Bits TypeScript declarations
        run: npm install --save-dev --workspace @rekt-ink/inkubator-lab @types/three --no-audit --no-fund

      - name: Test Inkubator protocol
        run: npm test -w @rekt-ink/inkubator-protocol

      - name: Compile Inkubator public state
        run: node scripts/inkubator/compile-state.mjs

      - name: Test Inkubator
        run: npm test -w @rekt-ink/inkubator-lab

      - name: Build Inkubator
        run: npm run build -w @rekt-ink/inkubator-lab

      - name: Enforce critical-path asset budgets
        run: node scripts/check-inkubator-budgets.mjs

      - name: Lighthouse mobile regression gate
        shell: bash
        run: |
          mkdir -p lighthouse-reports
          node scripts/serve-inkubator.mjs >/tmp/inkubator-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --compressed http://127.0.0.1:4175/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/inkubator-http.log
            echo "::error::Local Inkubator preview did not start"
            exit 1
          fi

          for run in 1 2 3; do
            npx --yes lighthouse@latest http://127.0.0.1:4175/ \
              --quiet \
              --output=json \
              --output-path="lighthouse-reports/run-$run.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          done

          node scripts/check-inkubator-lighthouse.mjs \
            lighthouse-reports/run-1.json \
            lighthouse-reports/run-2.json \
            lighthouse-reports/run-3.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkubator-lighthouse
          path: lighthouse-reports
          if-no-files-found: ignore

      - name: Persist generated preview to the isolated branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/inkubator-lab package-lock.json inkubator
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "build(inkubator): publish protocol preview [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkubator-reactbits-pro
          path: inkubator
          if-no-files-found: error
