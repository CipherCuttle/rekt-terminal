name: Phase 2 World rail one-shot repair

on:
  push:
    branches:
      - 'feature/inkubator-signal-system-v0'
    paths:
      - '.github/workflows/phase2-world-rail-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-signal-system-v0

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify canonical toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v24.20.0'
          test "$(npm -v)" = '11.19.0'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Patch World rail and add non-overlap regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path = Path('apps/inkubator-lab/src/signal-system/SignalSystem.module.css')
          css = css_path.read_text()
          old = ".worldSignalRail { display: grid; gap: var(--ink-space-3); align-self: end; }\n.worldPulse { padding: var(--ink-space-4); border-top: 1px solid var(--ink-border-standard); display: grid; grid-template-columns: auto 1fr; gap: var(--ink-space-3); }\n.worldPulse strong { font-size: 0.9rem; }\n.worldPulse span { color: var(--ink-text-meta); font-size: 0.78rem; }"
          new = ".worldSignalRail { display: grid; gap: var(--ink-space-3); align-self: end; }\n.worldPulse { padding: var(--ink-space-4); border-top: 1px solid var(--ink-border-standard); display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: var(--ink-space-3); align-items: start; }\n.worldPulse > div { min-width: 0; }\n.worldPulse > div strong, .worldPulse > div span { display: block; }\n.worldPulse > div strong { font-size: 0.9rem; line-height: 1.2; overflow-wrap: anywhere; }\n.worldPulse > div span { margin-top: var(--ink-space-1); color: var(--ink-text-meta); font-size: 0.78rem; line-height: 1.35; }"
          if css.count(old) != 1:
              raise SystemExit('World rail CSS anchor drifted; refusing broad rewrite')
          css_path.write_text(css.replace(old, new))

          test_path = Path('apps/inkubator-lab/e2e/golden-screens.spec.ts')
          test = test_path.read_text()
          anchor = "test('reduced motion disables ambient World orbit', async ({page}) => {"
          addition = """test('World live signal columns never overlap', async ({page}) => {
            await page.goto('/?lab=signals&screen=world');
            await waitForGoldenScreen(page, 'world');
            const pulses = page.getByLabel('World signals').locator(':scope > div');
            await expect(pulses).toHaveCount(4);
            for (let index = 0; index < 4; index += 1) {
              const pulse = pulses.nth(index);
              const signalBox = await pulse.locator(':scope > span').first().boundingBox();
              const copy = pulse.locator(':scope > div');
              const copyBox = await copy.boundingBox();
              const nameBox = await copy.locator('strong').boundingBox();
              const detailBox = await copy.locator('span').boundingBox();
              expect(signalBox).not.toBeNull();
              expect(copyBox).not.toBeNull();
              expect(nameBox).not.toBeNull();
              expect(detailBox).not.toBeNull();
              expect(signalBox!.x + signalBox!.width).toBeLessThanOrEqual(copyBox!.x);
              expect(nameBox!.y + nameBox!.height).toBeLessThanOrEqual(detailBox!.y + 1);
            }
          });

          """
          if test.count(anchor) != 1:
              raise SystemExit('Playwright insertion anchor drifted; refusing broad rewrite')
          if "World live signal columns never overlap" in test:
              raise SystemExit('World overlap regression already exists; refusing duplicate insertion')
          test_path.write_text(test.replace(anchor, addition + anchor))
          PY

      - name: Verify source and semantic tests
        run: |
          npm run verify:inkubator-signal-system
          npm run test -w @rekt-ink/inkubator-lab
          npm run build -w @rekt-ink/inkubator-lab
          npm run verify:inkubator-signal-system -- --dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerate five golden screenshots
        run: npm run test:e2e -w @rekt-ink/inkubator-lab -- --grep "visual baseline" --update-snapshots

      - name: Run complete browser gate
        run: npm run test:e2e -w @rekt-ink/inkubator-lab

      - name: Remove temporary workflows and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase2-world-rail-repair.yml
          rm -f .github/workflows/phase2-visual-inspection-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(inkubator): prevent World signal collisions'
          git push origin HEAD:feature/inkubator-signal-system-v0
