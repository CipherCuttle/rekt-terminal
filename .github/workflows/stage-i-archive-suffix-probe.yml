name: "Stage I archive post-F3 suffix probe"

on:
  push:
    branches:
      - "verify/stage-i-archive-suffix-v1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: rekt
          POSTGRES_PASSWORD: rekt_test
          POSTGRES_DB: rekt_inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekt -d rekt_inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekt:rekt_test@127.0.0.1:5432/rekt_inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
      INKUBATOR_DEV_AUTH: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: caf7b5fa1fad27480d1e627b829eaaa20e200ef9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @rekt-ink/inkubator-api
      - run: npm run migrate -w @rekt-ink/inkubator-api
      - name: "Run G2 through Stage-I suffix"
        run: >-
          node --test --test-concurrency=1
          apps/inkubator-api/test/integration/stage-g2b2-test-arena-persistence.test.mjs
          apps/inkubator-api/test/integration/stage-g3-selection.test.mjs
          apps/inkubator-api/test/integration/stage-h2-private-retention.test.mjs
          apps/inkubator-api/test/integration/stage-h3-session-security.test.mjs
          apps/inkubator-api/test/integration/stage-h5-challenge-burst-concurrency.test.mjs
          apps/inkubator-api/test/integration/stage-h5-cross-instance-quota.test.mjs
          apps/inkubator-api/test/integration/stage-h5-lease-fencing.test.mjs
          apps/inkubator-api/test/integration/stage-h5-reconciliation-concurrency.test.mjs
          apps/inkubator-api/test/integration/stage-h5-worker-observability.test.mjs
          apps/inkubator-api/test/integration/stage-h5-zero-inference-core.test.mjs
          apps/inkubator-api/test/integration/stage-h6-restore-drill.test.mjs
          apps/inkubator-api/test/integration/stage-h6-restore-privacy.test.mjs
          apps/inkubator-api/test/integration/stage-i-alpha-transport.test.mjs
          apps/inkubator-api/test/integration/stage-i-submit-credential-binding.test.mjs
          apps/inkubator-api/test/integration/stage-integration-funded-challenge-rehearsal.test.mjs
