name: Stage D OpenRouter usage check once

on:
  push:
    branches: ['agent/stage-d-openrouter-usage-check-v1']

permissions:
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Require configured OpenRouter secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}" || { echo 'OPENROUTER_API_KEY is not configured.'; exit 1; }

      - name: Read key usage without inference
        shell: bash
        run: |
          set -euo pipefail
          payload="$(curl --fail-with-body --silent --show-error https://openrouter.ai/api/v1/key -H "Authorization: Bearer ${OPENROUTER_API_KEY}")"
          PAYLOAD="$payload" node <<'NODE'
          const value = JSON.parse(process.env.PAYLOAD);
          const data = value.data ?? value;
          const safe = {
            usage: data.usage ?? null,
            usage_daily: data.usage_daily ?? null,
            usage_weekly: data.usage_weekly ?? null,
            usage_monthly: data.usage_monthly ?? null,
            limit: data.limit ?? null,
            limit_remaining: data.limit_remaining ?? null,
            is_free_tier: data.is_free_tier ?? null
          };
          console.log(JSON.stringify(safe, null, 2));
          NODE
