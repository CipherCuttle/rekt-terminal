name: Phase 7 Review Repair Verify

on:
  push:
    branches: [feature/inkubator-cheevo-reputation-boards-v0]
    paths:
      - '.github/workflows/phase7-review-repair-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: rekt
          POSTGRES_PASSWORD: rekt_test
          POSTGRES_DB: rekt_inkubator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rekt -d rekt_inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekt:rekt_test@127.0.0.1:5432/rekt_inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
      INKUBATOR_DEV_AUTH: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-cheevo-reputation-boards-v0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and build API
        run: |
          npm run typecheck -w @rekt-ink/inkubator-api
          npm run build -w @rekt-ink/inkubator-api
      - name: Verify generated client freshness
        run: npm run verify:client -w @rekt-ink/inkubator-api
      - name: Apply all migrations
        run: npm run migrate -w @rekt-ink/inkubator-api
      - name: Original Phase 7 anti-farming falsification
        run: timeout 180s node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase7-cheevo-reputation-boards.test.mjs
      - name: Hostile-review concurrency falsification
        run: timeout 180s node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase7-review-boundary-concurrency.test.mjs
      - name: Complete API Postgres integration
        run: timeout 360s npm run test:integration -w @rekt-ink/inkubator-api
