name: Phase 9A Instrument Calibration Capture

on:
  push:
    branches:
      - feature/inkubator-founding-cohort-rehearsal-v0
    paths:
      - .github/workflows/phase9-instrument-calibration-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Instrument Lab
        run: |
          npm run dev -w @rekt-ink/inkubator-lab > /tmp/instrument-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:5174/?lab=instrument' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/instrument-vite.log
          exit 1

      - name: Capture raw desktop mobile and state transition
        run: |
          mkdir -p calibration/video
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          const url = 'http://127.0.0.1:5174/?lab=instrument';
          const browser = await chromium.launch({headless: true});

          const desktop = await browser.newContext({
            viewport: {width: 1440, height: 900},
            recordVideo: {dir: 'calibration/video', size: {width: 1280, height: 720}},
          });
          const page = await desktop.newPage();
          await page.goto(url, {waitUntil: 'networkidle'});
          await page.getByRole('heading', {name: 'INSTRUMENT / MOTION LAB'}).waitFor();
          if (await page.locator('.ios-lab').getAttribute('data-crt') !== 'off') throw new Error('CRT must be off for raw capture');
          await page.screenshot({path: 'calibration/instrument-desktop-1440x900.png'});
          for (const [state, hold] of [['IDLE', 300], ['INPUT', 500], ['ACTIVE', 700], ['SUCCESS', 950], ['ERROR', 700]]) {
            await page.getByRole('button', {name: state}).click();
            await page.waitForTimeout(hold);
          }
          await desktop.close();

          const mobile = await browser.newContext({
            viewport: {width: 390, height: 844},
            reducedMotion: 'reduce',
          });
          const mobilePage = await mobile.newPage();
          await mobilePage.goto(url, {waitUntil: 'networkidle'});
          await mobilePage.getByRole('heading', {name: 'INSTRUMENT / MOTION LAB'}).waitFor();
          if (await mobilePage.locator('.ios-lab').getAttribute('data-crt') !== 'off') throw new Error('CRT must be off for mobile raw capture');
          await mobilePage.screenshot({path: 'calibration/instrument-mobile-390x844.png'});
          await mobile.close();
          await browser.close();
          EOF
          find calibration -maxdepth 3 -type f -print

      - name: Upload calibration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase9-instrument-calibration
          path: calibration
          if-no-files-found: error
          retention-days: 7
