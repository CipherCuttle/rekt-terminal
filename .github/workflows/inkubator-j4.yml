name: Inkubator J4 Production Candidate Verification

on:
  push:
    branches:
      - 'agent/stage-j4-**'
    paths:
      - '.github/workflows/inkubator-j4.yml'
      - 'contracts/inkubator-vault/**'
      - 'packages/inkubator-protocol/src/production-candidate-vault-adapter.*'
      - 'packages/inkubator-protocol/test/stage-j4-production-candidate.test.mjs'
      - 'packages/inkubator-protocol/package.json'
      - 'scripts/inkubator/stage-j4-**'
  pull_request:
    paths:
      - '.github/workflows/inkubator-j4.yml'
      - 'contracts/inkubator-vault/**'
      - 'packages/inkubator-protocol/src/production-candidate-vault-adapter.*'
      - 'packages/inkubator-protocol/test/stage-j4-production-candidate.test.mjs'
      - 'packages/inkubator-protocol/package.json'
      - 'scripts/inkubator/stage-j4-**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkubator-j4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
          cache: false

      - name: Verify pinned Foundry
        run: forge --version | grep -F '1.8.3'

      - name: Format Solidity working tree
        working-directory: contracts/inkubator-vault
        run: forge fmt

      - name: Verify formatter is idempotent
        working-directory: contracts/inkubator-vault
        run: forge fmt --check

      - name: Build candidate contracts
        working-directory: contracts/inkubator-vault
        run: forge build --sizes

      - name: Run J4 core vault suite
        working-directory: contracts/inkubator-vault
        run: forge test --match-contract ProductionCandidateChallengeVaultTest -vvv

      - name: Run J4 pre-audit matrix suite
        working-directory: contracts/inkubator-vault
        run: forge test --match-contract ProductionCandidatePreAuditMatrixTest -vvv

      - name: Run J4 adapter/finality/release tests
        run: node --test packages/inkubator-protocol/test/stage-j4-production-candidate.test.mjs

      - name: Generate J4 cross-language known-answer vectors
        run: node scripts/inkubator/stage-j4-known-answer-vectors.mjs

      - name: Verify forbidden release surfaces
        run: node scripts/inkubator/stage-j4-preaudit-verify.mjs

      - name: Build reproducible candidate release receipt
        if: github.event_name == 'push'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RESOLVER_SIGNER_SET_DIGEST: "0x7777777777777777777777777777777777777777777777777777777777777777"
        run: |
          node scripts/inkubator/stage-j4-release-candidate.mjs > /tmp/j4-release-candidate.json
          grep -F '"release_authority": "CANDIDATE_ONLY_NO_MAINNET_NO_MONEY"' /tmp/j4-release-candidate.json
          grep -F '"external_audit": "NOT_STARTED"' /tmp/j4-release-candidate.json
          grep -F '"production_money": "NOT_AUTHORIZED"' /tmp/j4-release-candidate.json

  ink_asset_probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
          cache: false

      - name: Read-only dual-RPC Ink/native-USDC identity probe
        run: node scripts/inkubator/stage-j4-readonly-ink-asset-probe.mjs

  release_repro_a:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      vault_creation: ${{ steps.hashes.outputs.vault_creation }}
      vault_runtime: ${{ steps.hashes.outputs.vault_runtime }}
      resolver_creation: ${{ steps.hashes.outputs.resolver_creation }}
      resolver_runtime: ${{ steps.hashes.outputs.resolver_runtime }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
          cache: false

      - name: Clean build A
        working-directory: contracts/inkubator-vault
        run: |
          rm -rf out cache
          forge build

      - name: Compute release hashes A
        id: hashes
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RESOLVER_SIGNER_SET_DIGEST: "0x7777777777777777777777777777777777777777777777777777777777777777"
        run: |
          node scripts/inkubator/stage-j4-release-candidate.mjs > /tmp/j4-release-a.json
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('/tmp/j4-release-a.json', 'utf8'));
          for (const key of [
            'vault_creation_bytecode_hash',
            'vault_runtime_bytecode_hash',
            'resolver_creation_bytecode_hash',
            'resolver_runtime_bytecode_hash',
          ]) {
            const out = key
              .replace('_bytecode_hash', '')
              .replace('vault_creation', 'vault_creation')
              .replace('vault_runtime', 'vault_runtime')
              .replace('resolver_creation', 'resolver_creation')
              .replace('resolver_runtime', 'resolver_runtime');
            console.log(`${out}=${receipt[key]}`);
          }
          NODE

  release_repro_b:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      vault_creation: ${{ steps.hashes.outputs.vault_creation }}
      vault_runtime: ${{ steps.hashes.outputs.vault_runtime }}
      resolver_creation: ${{ steps.hashes.outputs.resolver_creation }}
      resolver_runtime: ${{ steps.hashes.outputs.resolver_runtime }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
          cache: false

      - name: Clean build B
        working-directory: contracts/inkubator-vault
        run: |
          rm -rf out cache
          forge build

      - name: Compute release hashes B
        id: hashes
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RESOLVER_SIGNER_SET_DIGEST: "0x7777777777777777777777777777777777777777777777777777777777777777"
        run: |
          node scripts/inkubator/stage-j4-release-candidate.mjs > /tmp/j4-release-b.json
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('/tmp/j4-release-b.json', 'utf8'));
          for (const key of [
            'vault_creation_bytecode_hash',
            'vault_runtime_bytecode_hash',
            'resolver_creation_bytecode_hash',
            'resolver_runtime_bytecode_hash',
          ]) {
            const out = key
              .replace('_bytecode_hash', '')
              .replace('vault_creation', 'vault_creation')
              .replace('vault_runtime', 'vault_runtime')
              .replace('resolver_creation', 'resolver_creation')
              .replace('resolver_runtime', 'resolver_runtime');
            console.log(`${out}=${receipt[key]}`);
          }
          NODE

  release_repro_compare:
    if: github.event_name == 'push'
    needs: [release_repro_a, release_repro_b]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Compare independent clean-runner bytecode hashes
        run: |
          test "${{ needs.release_repro_a.outputs.vault_creation }}" = "${{ needs.release_repro_b.outputs.vault_creation }}"
          test "${{ needs.release_repro_a.outputs.vault_runtime }}" = "${{ needs.release_repro_b.outputs.vault_runtime }}"
          test "${{ needs.release_repro_a.outputs.resolver_creation }}" = "${{ needs.release_repro_b.outputs.resolver_creation }}"
          test "${{ needs.release_repro_a.outputs.resolver_runtime }}" = "${{ needs.release_repro_b.outputs.resolver_runtime }}"
