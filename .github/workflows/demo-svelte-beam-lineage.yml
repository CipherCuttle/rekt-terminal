name: Demo Svelte Beam Lineage

on:
  push:
    branches:
      - demo/inkubator-svelte-beam-lineage-v0
    paths:
      - 'demo/svelte-beam-lineage/**'
      - '.github/workflows/demo-svelte-beam-lineage.yml'

permissions:
  contents: write

jobs:
  build-demo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/inkubator-svelte-beam-lineage-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: demo/svelte-beam-lineage/package.json
      - name: Install demo dependencies
        working-directory: demo/svelte-beam-lineage
        run: npm install --no-audit --no-fund
      - name: Build native Svelte demo
        working-directory: demo/svelte-beam-lineage
        run: npm run build
      - name: Commit compiled static demo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f demo/svelte-beam-lineage/dist
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'chore(demo): build Svelte beam lineage [skip ci]'
          git push origin HEAD:demo/inkubator-svelte-beam-lineage-v0
