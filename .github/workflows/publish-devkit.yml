name: Publish DevKit

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify canonical API transport freshness
        run: |
          npm run typecheck -w @rekt-ink/inkubator-api
          npm run build -w @rekt-ink/inkubator-api
          npm run verify:client -w @rekt-ink/inkubator-api
      - run: npm run build:devkit
      - run: npm run test:devkit
      - run: npm publish -w @rekt-ink/protocol --access public --provenance
      - run: npm publish -w @rekt-ink/sdk --access public --provenance
      - run: npm publish -w @rekt-ink/cli --access public --provenance
      - run: npm publish -w @rekt-ink/mcp --access public --provenance
