name: Phase 3 backend assembly

on:
  push:
    branches:
      - 'feature/inkubator-player-mission-command-v0'
    paths:
      - '.github/workflows/phase3-backend-assemble.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-player-mission-command-v0

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify canonical toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v24.20.0'
          test "$(npm -v)" = '11.19.0'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair Fastify component-schema bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/inkubator-api/src/app.ts')
          text = path.read_text()

          build_anchor = "export function buildApp(options: BuildAppOptions) {\n"
          helper = """const FASTIFY_SCHEMA_ID = 'inkubator-component-schemas-v1';

          function rewriteFastifyRefs(value: unknown): unknown {
            if (Array.isArray(value)) return value.map(rewriteFastifyRefs);
            if (value === null || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value).map(([key, child]) => [
              key,
              key === '$ref' && typeof child === 'string' && child.startsWith('#/components/schemas/')
                ? child.replace('#/components/schemas/', `${FASTIFY_SCHEMA_ID}#/definitions/`)
                : rewriteFastifyRefs(child),
            ]));
          }

          const fastifyComponentSchemas = rewriteFastifyRefs(componentSchemas) as Record<string, object>;

          function fastifyBodySchema(name: keyof typeof componentSchemas) {
            return {$ref: `${FASTIFY_SCHEMA_ID}#/definitions/${name}`};
          }

          """
          if helper not in text:
              if text.count(build_anchor) != 1:
                  raise SystemExit('buildApp anchor drifted')
              text = text.replace(build_anchor, helper + build_anchor)

          app_anchor = "  const app = Fastify({logger: false});\n"
          app_registration = app_anchor + "\n  app.addSchema({$id: FASTIFY_SCHEMA_ID, definitions: fastifyComponentSchemas});\n"
          if app_registration not in text:
              if text.count(app_anchor) != 1:
                  raise SystemExit('Fastify construction anchor drifted')
              text = text.replace(app_anchor, app_registration)

          schema_names = [
              'DevSessionRequest',
              'DevelopmentProjectRequest',
              'PlayerProfileUpdateRequest',
              'MissionCreateRequest',
              'MissionUpdateRequest',
              'MissionGateUpdateRequest',
          ]
          for name in schema_names:
              old = f"schema: {{body: componentSchemas.{name}}}"
              new = f"schema: {{body: fastifyBodySchema('{name}')}}"
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{name} route schema anchor ambiguous')
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'{name} route schema anchor drifted')

          path.write_text(text)
          PY

      - name: Update graduated-route regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_path = Path('apps/inkubator-api/test/integration/phase1-exit-vertical.test.mjs')
          text = old_path.read_text()
          old = """test('temporary Phase-1 Project routes are absent when development auth is disabled', async () => {
            const db = createDatabase(databaseUrl);
            const app = buildApp({db, appOrigin, allowDevAuth: false, sessionTtlSeconds: 3600, github: null});
            const projectId = randomUUID();
            try {
              const create = await app.inject({method: 'POST', url: '/v1/development/projects', headers: {origin: appOrigin}, payload: {
                name: 'must not exist', goal: 'must not exist', ship_condition: 'must not exist', current_focus: 'must not exist', next_move: 'must not exist',
              }});
              assert.equal(create.statusCode, 404);
              assert.equal((await app.inject({method: 'GET', url: `/v1/projects/${projectId}`})).statusCode, 404);
              assert.equal((await app.inject({method: 'GET', url: `/v1/projects/${projectId}/private`})).statusCode, 404);
              assert.equal((await app.inject({method: 'POST', url: `/v1/projects/${projectId}/github-repositories`, headers: {origin: appOrigin}, payload: {repository_id: repositoryId}})).statusCode, 404);
            } finally {
              await app.close();
              await db.destroy();
            }
          });"""
          new = """test('development creation stays disabled while graduated Project routes remain registered', async () => {
            const db = createDatabase(databaseUrl);
            await migrateToLatest(db);
            const app = buildApp({db, appOrigin, allowDevAuth: false, sessionTtlSeconds: 3600, github: null});
            const projectId = randomUUID();
            try {
              const create = await app.inject({method: 'POST', url: '/v1/development/projects', headers: {origin: appOrigin}, payload: {
                name: 'must not exist', goal: 'must not exist', ship_condition: 'must not exist', current_focus: 'must not exist', next_move: 'must not exist',
              }});
              assert.equal(create.statusCode, 404);
              const publicProject = await app.inject({method: 'GET', url: `/v1/projects/${projectId}`});
              assert.equal(publicProject.statusCode, 404);
              assert.equal(publicProject.json().error, 'project_not_found');
              assert.equal((await app.inject({method: 'GET', url: `/v1/projects/${projectId}/private`})).statusCode, 401);
              assert.equal((await app.inject({method: 'POST', url: `/v1/projects/${projectId}/github-repositories`, headers: {origin: appOrigin}, payload: {repository_id: repositoryId}})).statusCode, 401);
            } finally {
              await app.close();
              await db.destroy();
            }
          });"""
          if text.count(old) != 1:
              raise SystemExit('phase1 route regression anchor drifted')
          old_path.write_text(text.replace(old, new))

          phase3 = Path('apps/inkubator-api/test/integration/phase3-player-mission-command.test.mjs')
          text = phase3.read_text()
          old = """    assert.notEqual((await app.inject({method: 'GET', url: `/v1/projects/${randomUUID()}`})).statusCode, 404, 'product Project route must be registered');"""
          new = """    const productProject = await app.inject({method: 'GET', url: `/v1/projects/${randomUUID()}`});
              assert.equal(productProject.statusCode, 404);
              assert.equal(productProject.json().error, 'project_not_found');"""
          if text.count(old) != 1:
              raise SystemExit('phase3 registered-route assertion anchor drifted')
          phase3.write_text(text.replace(old, new))
          PY

      - name: Generate typed client
        run: npm run generate:client -w @rekt-ink/inkubator-api

      - name: Build and unit test API
        run: |
          npm run build -w @rekt-ink/inkubator-api
          npm run test -w @rekt-ink/inkubator-api

      - name: Apply migrations
        run: npm run migrate -w @rekt-ink/inkubator-api

      - name: Run complete Postgres integration suite
        run: npm run test:integration -w @rekt-ink/inkubator-api

      - name: Verify generated client is now read-only current
        run: npm run verify:client -w @rekt-ink/inkubator-api

      - name: Commit assembled backend candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase3-backend-assemble.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(inkubator): assemble Player Mission Command backend'
          git push origin HEAD:feature/inkubator-player-mission-command-v0
