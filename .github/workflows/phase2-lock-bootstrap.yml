name: Phase 2 UI dependency lock bootstrap

on:
  push:
    branches:
      - 'feature/inkubator-signal-system-v0'
    paths:
      - 'apps/inkubator-lab/package.json'
      - '.github/workflows/phase2-lock-bootstrap.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-signal-system-v0

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0

      - name: Verify canonical toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v24.20.0'
          test "$(npm -v)" = '11.19.0'

      - name: Generate exact lockfile and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
          git diff --exit-code -- apps/inkubator-lab/package.json
          git rm .github/workflows/phase2-lock-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build(inkubator): lock Phase-2 UI dependencies'
          git push origin HEAD:feature/inkubator-signal-system-v0
