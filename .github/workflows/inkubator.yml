name: Inkubator Verification

on:
  push:
    branches:
      - main
      - 'foundation/**'
    paths:
      - '.github/workflows/inkubator.yml'
      - '.gitignore'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/inkubator-lab/**'
      - 'packages/inkubator-protocol/**'
      - 'content/inkubator/**'
      - 'scripts/inkubator/**'
      - 'scripts/check-inkubator-budgets.mjs'
      - 'scripts/check-inkubator-lighthouse.mjs'
      - 'scripts/serve-inkubator.mjs'
      - 'scripts/verify-inkubator-foundation.mjs'
  pull_request:
    paths:
      - '.github/workflows/inkubator.yml'
      - '.gitignore'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/inkubator-lab/**'
      - 'packages/inkubator-protocol/**'
      - 'content/inkubator/**'
      - 'scripts/inkubator/**'
      - 'scripts/check-inkubator-budgets.mjs'
      - 'scripts/check-inkubator-lighthouse.mjs'
      - 'scripts/serve-inkubator.mjs'
      - 'scripts/verify-inkubator-foundation.mjs'
  workflow_dispatch:

concurrency:
  group: inkubator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify public-source trust boundary
        run: npm run verify:inkubator-foundation

      - name: Test Inkubator protocol
        run: npm test -w @rekt-ink/inkubator-protocol

      - name: Verify generated public state is current
        shell: bash
        run: |
          set -euo pipefail
          node scripts/inkubator/compile-state.mjs
          git diff --exit-code -- apps/inkubator-lab/src/generated/inkubator-state.ts

      - name: Test Inkubator
        run: npm test -w @rekt-ink/inkubator-lab

      - name: Build Inkubator
        run: npm run build -w @rekt-ink/inkubator-lab

      - name: Enforce critical-path asset budgets
        run: node scripts/check-inkubator-budgets.mjs

      - name: Lighthouse mobile regression gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports
          node scripts/serve-inkubator.mjs >/tmp/inkubator-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --compressed http://127.0.0.1:4175/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/inkubator-http.log
            echo '::error::Local Inkubator preview did not start'
            exit 1
          fi

          for run in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4175/ \
              --quiet \
              --output=json \
              --output-path="lighthouse-reports/run-$run.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          done

          node scripts/check-inkubator-lighthouse.mjs \
            lighthouse-reports/run-1.json \
            lighthouse-reports/run-2.json \
            lighthouse-reports/run-3.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkubator-lighthouse
          path: lighthouse-reports
          if-no-files-found: ignore

      - name: Upload Inkubator build artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkubator-build
          path: inkubator
          if-no-files-found: error
