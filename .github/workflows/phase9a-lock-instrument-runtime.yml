name: Phase 9A Lock Instrument Runtime

on:
  push:
    branches: [feature/inkubator-founding-cohort-rehearsal-v0]
    paths:
      - '.github/workflows/phase9a-lock-instrument-runtime.yml'

permissions:
  contents: write

jobs:
  lock-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-founding-cohort-rehearsal-v0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lock canonical Instrument OS runtime dependencies
        run: npm install -w @rekt-ink/inkubator-lab --save-exact gsap@3.15.0 @gsap/react@2.1.2 pixi.js@8.20.1 @tanstack/react-router@1.170.33 @tanstack/react-query@5.102.8
      - name: Verify only dependency manifests changed
        run: |
          git diff --exit-code -- . ':(exclude)apps/inkubator-lab/package.json' ':(exclude)package-lock.json'
          git diff --check
      - name: Commit locked runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/inkubator-lab/package.json package-lock.json
          git commit -m 'build(inkubator): lock Instrument OS runtime stack'
          git push origin HEAD:feature/inkubator-founding-cohort-rehearsal-v0
