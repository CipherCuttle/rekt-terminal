name: agent-context

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    env:
      REPOMIX_VERSION: '1.18.0'
      EXPECTED_CONFIG_SHA256: 'fcc38825b6166fcbc2eb2301fcb604c7bd67b3610a9c4009279c134a5bbf6a12'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REF: ${{ github.head_ref || github.ref_name }}
      AUTHORITY_INCLUDE: >-
        AGENTS.md,docs/PRODUCT_BOUNDARIES_V1.md,docs/PROJECT_PLAN_V1.md,docs/RPS_REUSE_MATRIX_V1.md,docs/*CONTRACT*.md,docs/agent-packets/*.md,docs/agent-packets/**/*.md,docs/inkubator/*.md,docs/inkubator/**/*.md
      TERMINAL_RUNTIME_INCLUDE: >-
        AGENTS.md,docs/PRODUCT_BOUNDARIES_V1.md,docs/PROJECT_PLAN_V1.md,apps/api/src/**/*.{ts,tsx,js,mjs,cjs},apps/web/src/**/*.{ts,tsx,js,mjs,cjs},packages/*/src/**/*.{ts,tsx,js,mjs,cjs}
      INKUBATOR_RUNTIME_INCLUDE: >-
        AGENTS.md,docs/PRODUCT_BOUNDARIES_V1.md,docs/PROJECT_PLAN_V1.md,docs/inkubator/INDEX.md,apps/inkubator-api/src/**/*.{ts,tsx,js,mjs,cjs},apps/inkubator-lab/src/**/*.{ts,tsx,js,mjs,cjs},apps/inkubator-verifier/src/**/*.{ts,tsx,js,mjs,cjs},packages/*/src/**/*.{ts,tsx,js,mjs,cjs}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node for context tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install signed Repomix outside the checkout
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_userconfig: /dev/null
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/dev-spine-repomix"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          printf '{"private":true}\n' > package.json
          npm install --ignore-scripts --no-audit --no-fund --save-exact \
            --registry=https://registry.npmjs.org/ "repomix@${REPOMIX_VERSION}"
          npm audit signatures --registry=https://registry.npmjs.org/
          test "$("$tool_dir/node_modules/.bin/repomix" --version)" = "$REPOMIX_VERSION"

      - name: Generate exact-SHA agent context
        shell: bash
        run: |
          set -euo pipefail

          config_sha="$(sha256sum repomix.config.json | cut -d' ' -f1)"
          if [ "$config_sha" != "$EXPECTED_CONFIG_SHA256" ]; then
            echo "repomix.config.json digest mismatch; refusing PR-controlled packing policy" >&2
            exit 1
          fi

          compress="$(jq -r '.output.compress' repomix.config.json)"
          security_check="$(jq -r '.security.enableSecurityCheck' repomix.config.json)"
          token_budget="$(jq -r '.output.tokenBudget' repomix.config.json)"
          tool="$RUNNER_TEMP/dev-spine-repomix/node_modules/.bin/repomix"

          mkdir -p agent-context
          git ls-files | LC_ALL=C sort > agent-context/structure.txt

          "$tool" --config "$GITHUB_WORKSPACE/repomix.config.json" \
            --include "$AUTHORITY_INCLUDE" \
            --output agent-context/authority.xml

          "$tool" --config "$GITHUB_WORKSPACE/repomix.config.json" \
            --include "$TERMINAL_RUNTIME_INCLUDE" \
            --output agent-context/terminal-runtime.xml

          "$tool" --config "$GITHUB_WORKSPACE/repomix.config.json" \
            --include "$INKUBATOR_RUNTIME_INCLUDE" \
            --output agent-context/inkubator-runtime.xml

          structure_sha="$(sha256sum agent-context/structure.txt | cut -d' ' -f1)"
          authority_sha="$(sha256sum agent-context/authority.xml | cut -d' ' -f1)"
          terminal_sha="$(sha256sum agent-context/terminal-runtime.xml | cut -d' ' -f1)"
          inkubator_sha="$(sha256sum agent-context/inkubator-runtime.xml | cut -d' ' -f1)"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --arg schema_version 'dev-spine-agent-context-v2' \
            --arg purpose 'developer-tooling-rehydration' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_ref "$SOURCE_REF" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg generated_at "$generated_at" \
            --arg repomix_version "$REPOMIX_VERSION" \
            --arg config_sha256 "$config_sha" \
            --argjson compress "$compress" \
            --argjson security_check "$security_check" \
            --argjson token_budget "$token_budget" \
            --arg structure_sha256 "$structure_sha" \
            --arg authority_sha256 "$authority_sha" \
            --arg terminal_sha256 "$terminal_sha" \
            --arg inkubator_sha256 "$inkubator_sha" \
            --arg authority_include "$AUTHORITY_INCLUDE" \
            --arg terminal_include "$TERMINAL_RUNTIME_INCLUDE" \
            --arg inkubator_include "$INKUBATOR_RUNTIME_INCLUDE" \
            '{
              schema_version: $schema_version,
              purpose: $purpose,
              repository: $repository,
              source_sha: $source_sha,
              source_ref: $source_ref,
              event: $event,
              generated_at: $generated_at,
              trust: {
                authoritative: false,
                completeness: "product-scoped-bounded",
                generated_interpretation: true,
                product_authority: false,
                governance_authority: false,
                runtime_authority: false,
                merge_authority: false,
                source_inspection_required: true
              },
              generator: {
                name: "repomix",
                version: $repomix_version,
                dependency_install: "runner-temp+official-registry+ignore-scripts+npm-audit-signatures",
                config_sha256: $config_sha256,
                compress: $compress,
                security_check: $security_check,
                token_budget_per_pack: $token_budget
              },
              hydration: {
                rule: "Load authority.xml first, then exactly one product runtime pack. Use structure.txt for targeted full-source fetches; packed context never replaces source inspection for important logic.",
                terminal: ["authority.xml", "terminal-runtime.xml"],
                inkubator: ["authority.xml", "inkubator-runtime.xml"]
              },
              files: {
                "structure.txt": {sha256: $structure_sha256, role: "tracked-file-topology"},
                "authority.xml": {sha256: $authority_sha256, role: "authority-navigation", include: $authority_include},
                "terminal-runtime.xml": {sha256: $terminal_sha256, role: "terminal-runtime-context", include: $terminal_include},
                "inkubator-runtime.xml": {sha256: $inkubator_sha256, role: "inkubator-runtime-context", include: $inkubator_include}
              }
            }' > agent-context/metadata.json

      - name: Upload short-lived context artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-spine-context-${{ env.SOURCE_SHA }}
          path: agent-context/
          if-no-files-found: error
          retention-days: 3
