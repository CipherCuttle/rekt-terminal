name: Phase 8 DevKit Bootstrap

on:
  push:
    branches: [feature/inkubator-devkit-launch-surface-v0]
    paths:
      - '.github/workflows/phase8-devkit-bootstrap.yml'

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: rekt
          POSTGRES_PASSWORD: rekt_test
          POSTGRES_DB: rekt_inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekt -d rekt_inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekt:rekt_test@127.0.0.1:5432/rekt_inkubator
      INKUBATOR_APP_ORIGIN: https://inkubator.test
      INKUBATOR_DEV_AUTH: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-devkit-launch-surface-v0
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply frozen Phase 8 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path('.')

          # Root scripts: keep build:core byte-for-byte semantically unchanged; add a distinct DevKit contract.
          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          scripts = package['scripts']
          scripts['test:protocol'] = 'npm run test -w @rekt-ink/protocol'
          scripts['build:devkit'] = 'npm run build -w @rekt-ink/sdk && npm run build -w @rekt-ink/cli && npm run build -w @rekt-ink/mcp'
          scripts['test:devkit'] = 'npm run test -w @rekt-ink/protocol && npm run test -w @rekt-ink/sdk && npm run test -w @rekt-ink/cli && npm run test -w @rekt-ink/mcp'
          scripts['verify:devkit'] = 'npm run build:devkit && npm run test:devkit'
          scripts['build:canonical'] = 'npm run build:core && npm run build:inkubator && npm run build:devkit'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          api_package_path = root / 'apps/inkubator-api/package.json'
          api_package = json.loads(api_package_path.read_text())
          api_package['scripts']['generate:client'] = 'node --import ./dist/contract-phase8.js ./dist/generate-client.js'
          api_package['scripts']['verify:client'] = 'node --import ./dist/contract-phase8.js ./dist/generate-client.js --check'
          api_package_path.write_text(json.dumps(api_package, indent=2) + '\n')

          # Promote the existing protocol seed rather than copying it into a second definition.
          protocol_package_path = root / 'packages/inkubator-protocol/package.json'
          protocol_package = json.loads(protocol_package_path.read_text())
          protocol_package.update({
              'name': '@rekt-ink/protocol',
              'private': False,
              'version': '0.1.0',
              'type': 'module',
              'files': ['src', 'schema'],
              'types': './src/constants.d.ts',
              'exports': {
                  '.': {'types': './src/constants.d.ts', 'import': './src/constants.mjs'},
                  './server': './src/index.mjs',
                  './schema/*': './schema/*'
              },
              'publishConfig': {'access': 'public'}
          })
          protocol_package_path.write_text(json.dumps(protocol_package, indent=2) + '\n')

          # Database typing.
          database_path = root / 'apps/inkubator-api/src/database.ts'
          database = database_path.read_text()
          session_needle = '''export interface SessionTable {
            session_id: string;
            player_id: string;
            token_hash: string;
            created_at: Generated<Date>;
            expires_at: Date;
            revoked_at: Date | null;
          }
          '''
          devkit_types = session_needle + '''
          export type DevkitCredentialClass = 'CLI' | 'MCP' | 'AUTOMATION';
          export interface DevkitTokenTable {
            token_id: string;
            player_id: string;
            creation_request_id: string;
            credential_class: DevkitCredentialClass;
            label: string;
            token_hash: string;
            scopes: unknown;
            created_at: Generated<Date>;
            expires_at: Date;
            revoked_at: Date | null;
            rate_window_started_at: Generated<Date>;
            rate_count: Generated<number>;
            last_used_at: Date | null;
          }
          '''
          if session_needle not in database:
              raise SystemExit('database SessionTable patch anchor missing')
          database = database.replace(session_needle, devkit_types, 1)
          schema_needle = '  sessions: SessionTable;\n'
          if schema_needle not in database:
              raise SystemExit('database schema patch anchor missing')
          database = database.replace(schema_needle, schema_needle + '  devkit_tokens: DevkitTokenTable;\n', 1)
          database_path.write_text(database)

          # Migration registration.
          migrations_path = root / 'apps/inkubator-api/src/migrations.ts'
          migrations = migrations_path.read_text()
          import_needle = "import {phase7CheevoReputationMigration} from './migrations/017-phase7-cheevo-reputation.js';\n"
          migrations = migrations.replace(import_needle, import_needle + "import {phase8DevkitCredentialsMigration} from './migrations/018-phase8-devkit-credentials.js';\n", 1)
          registry_needle = "      '017_phase7_cheevo_reputation': phase7CheevoReputationMigration,\n"
          migrations = migrations.replace(registry_needle, registry_needle + "      '018_phase8_devkit_credentials': phase8DevkitCredentialsMigration,\n", 1)
          migrations_path.write_text(migrations)

          # App registration is deliberately tiny: browser cookie auth stays unchanged; /v1/devkit owns bearer policy.
          app_path = root / 'apps/inkubator-api/src/app.ts'
          app = app_path.read_text()
          import_needle = "import {registerPhase7ReputationRoutes} from './reputation-api.js';\n"
          app = app.replace(import_needle, import_needle + "import {registerPhase8DevkitRoutes} from './devkit-api.js';\n", 1)
          prehandler_needle = "    if (request.url === '/v1/github/webhook') return;\n    if (request.headers.origin !== options.appOrigin) return error(reply, 403, 'origin_not_allowed');"
          prehandler_replacement = "    if (request.url === '/v1/github/webhook') return;\n    if (request.url.startsWith('/v1/devkit/')) return;\n    if (request.headers.origin !== options.appOrigin) return error(reply, 403, 'origin_not_allowed');"
          if prehandler_needle not in app:
              raise SystemExit('app preHandler patch anchor missing')
          app = app.replace(prehandler_needle, prehandler_replacement, 1)
          register_needle = '  registerPhase7ReputationRoutes(app, options.db);\n'
          if register_needle not in app:
              raise SystemExit('app route registration anchor missing')
          app = app.replace(register_needle, register_needle + '  registerPhase8DevkitRoutes(app, options.db, {appOrigin: options.appOrigin});\n', 1)
          app_path.write_text(app)

          # Generated transport: same OpenAPI source, two consumers, optional bearer injection.
          generator_path = root / 'apps/inkubator-api/src/generate-client.ts'
          generator = generator_path.read_text()
          ops_anchor = "] as const;\n\nfunction primitiveType"
          devkit_ops = """  ['/v1/devkit/tokens', 'post'],
            ['/v1/devkit/tokens', 'get'],
            ['/v1/devkit/tokens/{tokenId}/revoke', 'post'],
            ['/v1/devkit/me', 'get'],
            ['/v1/devkit/player/profile', 'get'],
            ['/v1/devkit/mission/current', 'get'],
            ['/v1/devkit/mission/current', 'patch'],
            ['/v1/devkit/mission/current/claims/{gateKey}', 'post'],
            ['/v1/devkit/project/current', 'get'],
            ['/v1/devkit/project/current/help-beacons', 'get'],
            ['/v1/devkit/project/current/help-beacons', 'post'],
            ['/v1/devkit/help-beacons/{beaconId}/assists', 'post'],
            ['/v1/devkit/project/current/activity', 'get'],
            ['/v1/devkit/mission/current/ship', 'post'],
          """
          if ops_anchor not in generator:
              raise SystemExit('generator operations anchor missing')
          generator = generator.replace(ops_anchor, devkit_ops + '] as const;\n\nfunction primitiveType', 1)
          ctor_anchor = """  constructor(
              private readonly baseUrl = '',
              private readonly fetchImpl: FetchLike = fetch,
            ) {}
          """
          ctor_replacement = """  constructor(
              private readonly baseUrl = '',
              private readonly fetchImpl: FetchLike = fetch,
              private readonly accessToken?: string,
            ) {}
          """
          if ctor_anchor not in generator:
              raise SystemExit('generator constructor anchor missing')
          generator = generator.replace(ctor_anchor, ctor_replacement, 1)
          header_anchor = "    if (init.body !== undefined) headers.set('content-type', 'application/json');\n"
          generator = generator.replace(header_anchor, header_anchor + "    if (this.accessToken) headers.set('authorization', `Bearer ${this.accessToken}`);\n", 1)
          tail_index = generator.find('const target = fileURLToPath')
          if tail_index < 0:
              raise SystemExit('generator target anchor missing')
          generator = generator[:tail_index] + r'''const targets = [
            fileURLToPath(new URL('../../inkubator-lab/src/generated/inkubator-api-client.ts', import.meta.url)),
            fileURLToPath(new URL('../../../packages/sdk/src/generated/inkubator-api-client.ts', import.meta.url)),
          ];
          if (process.argv.includes('--check')) {
            const stale = targets.filter((target) => !fs.existsSync(target) || fs.readFileSync(target, 'utf8') !== generated);
            if (stale.length > 0) {
              console.error(`Generated Inkubator API client is stale: ${stale.join(', ')}. Run npm run generate:client -w @rekt-ink/inkubator-api`);
              process.exit(1);
            }
            console.log('Generated Inkubator API clients: PASS');
          } else {
            for (const target of targets) {
              fs.mkdirSync(new URL('.', `file://${target}`), {recursive: true});
              fs.writeFileSync(target, generated);
              console.log(`Generated ${target}`);
            }
          }
          '''
          # fs.mkdirSync(URL('.', file://...)) is fragile for paths; normalize it after writing.
          generator = generator.replace("fs.mkdirSync(new URL('.', `file://${target}`), {recursive: true});", "fs.mkdirSync(target.slice(0, target.lastIndexOf('/')), {recursive: true});")
          generator_path.write_text(generator)
          PY

          mkdir -p packages/inkubator-protocol/src packages/sdk/src/generated packages/sdk/test packages/cli/src packages/cli/test packages/mcp/src packages/mcp/test apps/inkubator-api/src/migrations apps/inkubator-api/test/integration docs/inkubator

          cat > packages/inkubator-protocol/src/constants.mjs <<'EOF'
          export const PROTOCOL_VERSION = 'inkubator-devkit/0.1';
          export const TRUTH_CLASSES = Object.freeze(['CLAIM', 'OBSERVATION', 'PROOF']);
          export const DEVKIT_SCOPES = Object.freeze([
            'player:read',
            'project:read',
            'mission:read',
            'claim:write',
            'update:write',
            'beacon:write',
            'assist:write',
            'ship:prepare',
          ]);
          export const DEVKIT_FORBIDDEN_AUTHORITIES = Object.freeze([
            'proof:write',
            'achievement:grant',
            'ship:approve',
            'reputation:write',
            'player:moderate',
            'round:admin',
          ]);
          EOF

          cat > packages/inkubator-protocol/src/constants.d.ts <<'EOF'
          export declare const PROTOCOL_VERSION: 'inkubator-devkit/0.1';
          export declare const TRUTH_CLASSES: readonly ['CLAIM', 'OBSERVATION', 'PROOF'];
          export declare const DEVKIT_SCOPES: readonly ['player:read', 'project:read', 'mission:read', 'claim:write', 'update:write', 'beacon:write', 'assist:write', 'ship:prepare'];
          export type DevkitScope = typeof DEVKIT_SCOPES[number];
          export declare const DEVKIT_FORBIDDEN_AUTHORITIES: readonly ['proof:write', 'achievement:grant', 'ship:approve', 'reputation:write', 'player:moderate', 'round:admin'];
          EOF

          cat > apps/inkubator-api/src/migrations/018-phase8-devkit-credentials.ts <<'EOF'
          import {sql} from 'kysely';
          import type {Migration} from 'kysely/migration';

          export const phase8DevkitCredentialsMigration: Migration = {
            async up(db) {
              await db.schema.createTable('devkit_tokens')
                .addColumn('token_id', 'uuid', (column) => column.primaryKey())
                .addColumn('player_id', 'uuid', (column) => column.notNull().references('players.player_id').onDelete('cascade'))
                .addColumn('creation_request_id', 'uuid', (column) => column.notNull())
                .addColumn('credential_class', 'text', (column) => column.notNull())
                .addColumn('label', 'text', (column) => column.notNull())
                .addColumn('token_hash', 'varchar(64)', (column) => column.notNull().unique())
                .addColumn('scopes', 'jsonb', (column) => column.notNull())
                .addColumn('created_at', 'timestamptz', (column) => column.notNull().defaultTo(sql`clock_timestamp()`))
                .addColumn('expires_at', 'timestamptz', (column) => column.notNull())
                .addColumn('revoked_at', 'timestamptz')
                .addColumn('rate_window_started_at', 'timestamptz', (column) => column.notNull().defaultTo(sql`clock_timestamp()`))
                .addColumn('rate_count', 'integer', (column) => column.notNull().defaultTo(0))
                .addColumn('last_used_at', 'timestamptz')
                .addUniqueConstraint('devkit_tokens_issue_request_once', ['player_id', 'creation_request_id'])
                .addCheckConstraint('devkit_tokens_class', sql`credential_class in ('CLI', 'MCP', 'AUTOMATION')`)
                .addCheckConstraint('devkit_tokens_label', sql`char_length(label) between 1 and 80`)
                .addCheckConstraint('devkit_tokens_scopes_array', sql`jsonb_typeof(scopes) = 'array'`)
                .addCheckConstraint('devkit_tokens_expiry', sql`expires_at > created_at`)
                .addCheckConstraint('devkit_tokens_rate_count', sql`rate_count >= 0`)
                .execute();

              await db.schema.createIndex('devkit_tokens_player_idx').on('devkit_tokens').columns(['player_id', 'created_at']).execute();
              await db.schema.createIndex('devkit_tokens_expiry_idx').on('devkit_tokens').columns(['expires_at', 'revoked_at']).execute();
            },
            async down(db) {
              await db.schema.dropTable('devkit_tokens').execute();
            },
          };
          EOF

          cat > apps/inkubator-api/src/devkit.ts <<'EOF'
          import {createHash, randomBytes, randomUUID} from 'node:crypto';
          import {sql, type Kysely} from 'kysely';
          import {readDatabaseNow, type DatabaseSchema, type DevkitCredentialClass} from './database.js';

          export const DEVKIT_SCOPES = [
            'player:read', 'project:read', 'mission:read', 'claim:write',
            'update:write', 'beacon:write', 'assist:write', 'ship:prepare',
          ] as const;
          export type DevkitScope = typeof DEVKIT_SCOPES[number];
          export const DEVKIT_RATE_LIMIT_PER_MINUTE = 60;
          export const DEVKIT_TOKEN_MAX_TTL_SECONDS = 30 * 24 * 60 * 60;
          const DEVKIT_TOKEN_MIN_TTL_SECONDS = 5 * 60;
          const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          const SCOPE_SET = new Set<string>(DEVKIT_SCOPES);
          const CLASS_SET = new Set<DevkitCredentialClass>(['CLI', 'MCP', 'AUTOMATION']);

          export interface ResolvedDevkitCredential {
            tokenId: string;
            playerId: string;
            credentialClass: DevkitCredentialClass;
            scopes: DevkitScope[];
            expiresAt: Date;
          }

          export interface IssueDevkitTokenInput {
            requestId: string;
            credentialClass: DevkitCredentialClass;
            label: string;
            scopes: string[];
            expiresInSeconds: number;
          }

          function tokenHash(token: string): string {
            return createHash('sha256').update(token, 'utf8').digest('hex');
          }

          function normalizeScopes(scopes: unknown): DevkitScope[] {
            if (!Array.isArray(scopes) || scopes.length < 1 || scopes.length > DEVKIT_SCOPES.length) throw new Error('invalid_devkit_scopes');
            const normalized = [...new Set(scopes.map((scope) => {
              if (typeof scope !== 'string' || !SCOPE_SET.has(scope)) throw new Error('invalid_devkit_scope');
              return scope as DevkitScope;
            }))].sort();
            return normalized;
          }

          function normalizeLabel(label: string): string {
            if (typeof label !== 'string') throw new Error('invalid_devkit_label');
            const normalized = label.trim().replace(/\s+/g, ' ');
            if (normalized.length < 1 || normalized.length > 80) throw new Error('invalid_devkit_label');
            return normalized;
          }

          export function readBearerToken(value: string | string[] | undefined): string | null {
            const header = Array.isArray(value) ? value[0] : value;
            if (!header) return null;
            const match = /^Bearer\s+([^\s]+)$/i.exec(header.trim());
            return match?.[1] ?? null;
          }

          export function hasDevkitScope(credential: ResolvedDevkitCredential, scope: DevkitScope): boolean {
            return credential.scopes.includes(scope);
          }

          export async function issueDevkitToken(
            db: Kysely<DatabaseSchema>,
            playerId: string,
            input: IssueDevkitTokenInput,
          ) {
            if (!UUID_PATTERN.test(input.requestId)) throw new Error('invalid_request_id');
            if (!CLASS_SET.has(input.credentialClass)) throw new Error('invalid_devkit_credential_class');
            const label = normalizeLabel(input.label);
            const scopes = normalizeScopes(input.scopes);
            if (!Number.isSafeInteger(input.expiresInSeconds) || input.expiresInSeconds < DEVKIT_TOKEN_MIN_TTL_SECONDS || input.expiresInSeconds > DEVKIT_TOKEN_MAX_TTL_SECONDS) {
              throw new Error('invalid_devkit_token_ttl');
            }
            const rawToken = `rekt_dk_${randomBytes(32).toString('base64url')}`;
            const tokenId = randomUUID();
            const now = await readDatabaseNow(db);
            const expiresAt = new Date(now.getTime() + input.expiresInSeconds * 1000);

            await db.transaction().execute(async (tx) => {
              await tx.selectFrom('players').select('player_id').where('player_id', '=', playerId).forUpdate().executeTakeFirstOrThrow();
              const replay = await tx.selectFrom('devkit_tokens').select('token_id')
                .where('player_id', '=', playerId)
                .where('creation_request_id', '=', input.requestId.toLowerCase())
                .executeTakeFirst();
              if (replay) throw new Error('devkit_token_issue_replayed');
              await tx.insertInto('devkit_tokens').values({
                token_id: tokenId,
                player_id: playerId,
                creation_request_id: input.requestId.toLowerCase(),
                credential_class: input.credentialClass,
                label,
                token_hash: tokenHash(rawToken),
                scopes,
                expires_at: expiresAt,
                revoked_at: null,
                last_used_at: null,
              }).executeTakeFirstOrThrow();
            });

            return {
              schema_version: 'devkit.token.issued.v1' as const,
              token_id: tokenId,
              credential_class: input.credentialClass,
              label,
              scopes,
              token: rawToken,
              expires_at: expiresAt.toISOString(),
            };
          }

          export async function listDevkitTokens(db: Kysely<DatabaseSchema>, playerId: string) {
            const rows = await db.selectFrom('devkit_tokens').select([
              'token_id', 'credential_class', 'label', 'scopes', 'created_at', 'expires_at', 'revoked_at', 'last_used_at',
            ]).where('player_id', '=', playerId).orderBy('created_at', 'desc').execute();
            return rows.map((row) => ({
              schema_version: 'devkit.token.summary.v1' as const,
              token_id: row.token_id,
              credential_class: row.credential_class,
              label: row.label,
              scopes: normalizeScopes(row.scopes),
              created_at: row.created_at.toISOString(),
              expires_at: row.expires_at.toISOString(),
              revoked_at: row.revoked_at?.toISOString() ?? null,
              last_used_at: row.last_used_at?.toISOString() ?? null,
            }));
          }

          export async function revokeDevkitToken(db: Kysely<DatabaseSchema>, playerId: string, tokenId: string) {
            if (!UUID_PATTERN.test(tokenId)) throw new Error('invalid_devkit_token_id');
            const row = await db.updateTable('devkit_tokens')
              .set({revoked_at: sql<Date>`coalesce(revoked_at, clock_timestamp())`})
              .where('token_id', '=', tokenId.toLowerCase())
              .where('player_id', '=', playerId)
              .returning(['token_id', 'revoked_at'])
              .executeTakeFirst();
            if (!row) throw new Error('devkit_token_not_found');
            return {schema_version: 'devkit.token.revoked.v1' as const, token_id: row.token_id, revoked_at: row.revoked_at!.toISOString()};
          }

          export async function resolveDevkitCredential(db: Kysely<DatabaseSchema>, token: string): Promise<ResolvedDevkitCredential | null> {
            const row = await db.selectFrom('devkit_tokens').select(['token_id', 'player_id', 'credential_class', 'scopes', 'expires_at'])
              .where('token_hash', '=', tokenHash(token))
              .where('revoked_at', 'is', null)
              .where('expires_at', '>', sql<Date>`clock_timestamp()`)
              .executeTakeFirst();
            if (!row) return null;
            return {tokenId: row.token_id, playerId: row.player_id, credentialClass: row.credential_class, scopes: normalizeScopes(row.scopes), expiresAt: row.expires_at};
          }

          export async function consumeDevkitRateLimit(db: Kysely<DatabaseSchema>, tokenId: string) {
            return db.transaction().execute(async (tx) => {
              const row = await tx.selectFrom('devkit_tokens').select(['rate_window_started_at', 'rate_count', 'revoked_at', 'expires_at'])
                .where('token_id', '=', tokenId).forUpdate().executeTakeFirst();
              if (!row || row.revoked_at || row.expires_at.getTime() <= Date.now()) return {allowed: false as const, invalid: true as const, retryAfterSeconds: 0};
              const now = await readDatabaseNow(tx);
              const elapsedMs = now.getTime() - row.rate_window_started_at.getTime();
              if (elapsedMs >= 60_000) {
                await tx.updateTable('devkit_tokens').set({rate_window_started_at: now, rate_count: 1, last_used_at: now}).where('token_id', '=', tokenId).execute();
                return {allowed: true as const, remaining: DEVKIT_RATE_LIMIT_PER_MINUTE - 1};
              }
              if (row.rate_count >= DEVKIT_RATE_LIMIT_PER_MINUTE) {
                return {allowed: false as const, invalid: false as const, retryAfterSeconds: Math.max(1, Math.ceil((60_000 - elapsedMs) / 1000))};
              }
              await tx.updateTable('devkit_tokens').set({rate_count: row.rate_count + 1, last_used_at: now}).where('token_id', '=', tokenId).execute();
              return {allowed: true as const, remaining: DEVKIT_RATE_LIMIT_PER_MINUTE - row.rate_count - 1};
            });
          }
          EOF

          cat > apps/inkubator-api/src/contract-phase8.ts <<'EOF'
          import './contract-phase7.js';
          import {componentSchemas, openapiDocument} from './contract.js';

          const schemas = componentSchemas as unknown as Record<string, any>;
          const paths = openapiDocument.paths as unknown as Record<string, any>;
          const components = openapiDocument.components as unknown as Record<string, any>;
          components.securitySchemes.devkitBearer = {type: 'http', scheme: 'bearer', bearerFormat: 'opaque'};
          const ref = (name: string) => ({$ref: `#/components/schemas/${name}`});
          const errorResponse = (description: string) => ({description, content: {'application/json': {schema: ref('Error')}}});
          const bearer = (scope: string) => [{devkitBearer: []}, {'x-rekt-scope': scope}];

          schemas.DevkitScope = {type: 'string', enum: ['player:read','project:read','mission:read','claim:write','update:write','beacon:write','assist:write','ship:prepare']};
          schemas.DevkitCredentialClass = {type: 'string', enum: ['CLI','MCP','AUTOMATION']};
          schemas.DevkitTokenIssueRequest = {type:'object',additionalProperties:false,required:['request_id','credential_class','label','scopes','expires_in_seconds'],properties:{request_id:ref('RequestId'),credential_class:ref('DevkitCredentialClass'),label:{type:'string',minLength:1,maxLength:80},scopes:{type:'array',minItems:1,maxItems:8,uniqueItems:true,items:ref('DevkitScope')},expires_in_seconds:{type:'integer',minimum:300,maximum:2592000}}};
