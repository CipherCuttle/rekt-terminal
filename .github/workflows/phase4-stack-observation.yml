name: Phase 4 stack observation

on:
  push:
    branches:
      - 'feature/inkubator-github-evidence-daemon-v0'
    paths:
      - '.github/workflows/phase4-stack-observation.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: rekt
          POSTGRES_PASSWORD: rekt_test
          POSTGRES_DB: rekt_inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekt -d rekt_inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekt:rekt_test@127.0.0.1:5432/rekt_inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
      INKUBATOR_DEV_AUTH: '1'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify lineage and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = 'v24.20.0'
          test "$(npm -v)" = '11.19.0'
          git merge-base --is-ancestor e4cbf2a79d881f83b0345b2718c0ad0275394e4f HEAD

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Normalize exported stack vocabulary name
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/phase4_stack_observation.py')
          text = p.read_text()
          text = text.replace('export const DETECTED_STACKS = [', 'export const DETECTED_STACK_VALUES = [', 1)
          text = text.replace('(typeof DETECTED_STACKS)[number]', '(typeof DETECTED_STACK_VALUES)[number]', 1)
          text = text.replace('new Set<string>(DETECTED_STACKS)', 'new Set<string>(DETECTED_STACK_VALUES)', 1)
          p.write_text(text)
          PY

      - name: Apply bounded stack observation wiring
        run: python3 .github/scripts/phase4_stack_observation.py

      - name: Generate client
        run: npm run generate:client -w @rekt-ink/inkubator-api

      - name: Focused Phase 4 regression
        run: node --test --test-concurrency=1 apps/inkubator-api/test/integration/phase4-github-evidence-daemon.test.mjs

      - name: Unit tests
        run: npm run test -w @rekt-ink/inkubator-api

      - name: Complete Postgres integration
        run: npm run test:integration -w @rekt-ink/inkubator-api

      - name: Generated client current
        run: npm run verify:client -w @rekt-ink/inkubator-api

      - name: Commit stack observation and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/phase4-stack-observation.yml .github/scripts/phase4_stack_observation.py
          git add apps/inkubator-api/src/evidence.ts apps/inkubator-api/src/github.ts apps/inkubator-api/src/jobs.ts apps/inkubator-api/src/mission-command.ts apps/inkubator-api/src/contract.ts apps/inkubator-api/test/integration/phase4-github-evidence-daemon.test.mjs apps/inkubator-lab/src/generated/inkubator-api-client.ts
          git commit -m 'feat(inkubator): observe bounded GitHub stack evidence'
          git push origin HEAD:feature/inkubator-github-evidence-daemon-v0
