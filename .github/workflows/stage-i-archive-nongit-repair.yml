name: "Stage I archive non-Git repair gate"

on:
  push:
    branches:
      - "agent/stage-i-archive-nongit-terminal-v1"
    paths:
      - ".github/workflows/stage-i-archive-nongit-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/inkubator"
    steps:
      - name: "Check out repair branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "agent/stage-i-archive-nongit-terminal-v1"
          fetch-depth: 0

      - name: "Set up Node"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: "Patch, verify, and commit repair"
        run: bash scripts/stage-i-archive-nongit-repair.sh
