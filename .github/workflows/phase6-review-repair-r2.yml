name: Phase 6 Final Review Repair R2

on:
  push:
    branches: [feature/inkubator-ship-verifier-receipt-v0]
    paths:
      - '.github/workflows/phase6-review-repair-r2.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: rekt
          POSTGRES_PASSWORD: rekt_test
          POSTGRES_DB: rekt_inkubator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rekt -d rekt_inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekt:rekt_test@127.0.0.1:5432/rekt_inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
      INKUBATOR_DEV_AUTH: '1'
      NODE_ENV: test

    steps:
      - name: Check out exact Phase 6 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/inkubator-ship-verifier-receipt-v0

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply bounded Codex review repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/inkubator-api/src/ship.ts',
              """function observationView(row: Selectable<ShipVerifierObservationTable>) {
            return {schema_version:'ship.verifier_observation.public.v1' as const, outcome:row.outcome, reason_code:row.reason_code,
              ...(row.final_url?{final_url:row.final_url}:{}), ...(row.http_status!==null?{http_status:row.http_status}:{}), duration_ms:row.duration_ms, redirects:row.redirects, observed_at:row.observed_at.toISOString()};
          }
          """,
              """function observationView(row: Selectable<ShipVerifierObservationTable>) {
            return {schema_version:'ship.verifier_observation.public.v1' as const, outcome:row.outcome, reason_code:row.reason_code,
              ...(row.http_status!==null?{http_status:row.http_status}:{}), duration_ms:row.duration_ms, redirects:row.redirects, observed_at:row.observed_at.toISOString()};
          }
          """,
          )
          replace_once(
              'apps/inkubator-api/src/ship.ts',
              """    const active=await tx.selectFrom('ship_submissions').select('submission_id').where('mission_id','=',missionId).where('state','in',['SUBMITTED','OBSERVED','ATTENTION']).executeTakeFirst();
              if(active)throw new Error('ship_submission_active');
          """,
              """    const active=await tx.selectFrom('ship_submissions').select(['submission_id','state']).where('mission_id','=',missionId).where('state','in',['SUBMITTED','OBSERVED','ATTENTION']).executeTakeFirst();
              if(active){
                const activeObservation=await tx.selectFrom('ship_verifier_observations').select('outcome').where('submission_id','=',active.submission_id).executeTakeFirst();
                if(active.state!=='ATTENTION'||activeObservation?.outcome!=='UNAVAILABLE')throw new Error('ship_submission_active');
              }
          """,
          )

          jobs = Path('apps/inkubator-api/src/jobs.ts')
          text = jobs.read_text()
          old = "  const result=verifierResult(await client.verify({submissionId:input.submissionId,url:input.artifactUrl}),input.submissionId);\n  await db.transaction().execute(async tx=>{"
          new = "  const result=verifierResult(await client.verify({submissionId:input.submissionId,url:input.artifactUrl}),input.submissionId);\n  if(result.outcome==='UNAVAILABLE'&&job.attempts<job.max_attempts)throw new Error(`ship_verifier_transient_unavailable:${result.reasonCode}`);\n  await db.transaction().execute(async tx=>{"
          if text.count(old) != 1: raise SystemExit('jobs.ts: verifier retry anchor mismatch')
          text = text.replace(old, new, 1)
          old = "    await tx.updateTable('ship_submissions').set({state:result.outcome==='PASS'?'OBSERVED':'ATTENTION',updated_at:now}).where('submission_id','=',input.submissionId).execute();\n    await appendHistoryEvent(tx,{eventFamily:'evidence',eventType:'project.ship_verifier.observed'"
          new = "    await tx.updateTable('ship_submissions').set({state:result.outcome==='PASS'?'OBSERVED':'ATTENTION',updated_at:now}).where('submission_id','=',input.submissionId).execute();\n    if(result.outcome==='UNAVAILABLE'){\n      const released=await tx.updateTable('missions').set({state:'SHIP_READY',updated_at:now}).where('mission_id','=',submission.mission_id).where('state','=','SUBMITTED').executeTakeFirst();\n      if(Number(released.numUpdatedRows)!==1)throw new Error('ship_verification_retry_release_invariant');\n    }\n    await appendHistoryEvent(tx,{eventFamily:'evidence',eventType:'project.ship_verifier.observed'"
          if text.count(old) != 1: raise SystemExit('jobs.ts: unavailable release anchor mismatch')
          text = text.replace(old, new, 1)
          old = "payload:{schema_version:'project.ship_verifier.observed.v1',submission_id:input.submissionId,outcome:result.outcome,reason_code:result.reasonCode,...(result.finalUrl?{final_url:result.finalUrl}:{}),...(result.httpStatus!==null?{http_status:result.httpStatus}:{}),duration_ms:result.durationMs,redirects:result.redirects,truth_state:result.outcome==='UNAVAILABLE'?'UNKNOWN':'OBSERVED'}});"
          new = "payload:{schema_version:'project.ship_verifier.observed.v1',submission_id:input.submissionId,outcome:result.outcome,reason_code:result.reasonCode,...(result.httpStatus!==null?{http_status:result.httpStatus}:{}),duration_ms:result.durationMs,redirects:result.redirects,truth_state:result.outcome==='UNAVAILABLE'?'UNKNOWN':'OBSERVED'}});"
          if text.count(old) != 1: raise SystemExit('jobs.ts: history final_url anchor mismatch')
          jobs.write_text(text.replace(old, new, 1))

          policy = Path('apps/inkubator-verifier/src/policy.ts')
          text = policy.read_text()
          anchor = "export async function resolveSafeTarget(raw: string | URL, resolver: Resolver = systemResolver): Promise<SafeTarget> {\n"
          helper = """async function resolveWithTimeout(hostname: string, resolver: Resolver, timeoutMs: number | undefined): Promise<ResolvedAddress[]> {
            if (timeoutMs === undefined) return resolver(hostname);
            if (!Number.isFinite(timeoutMs) || timeoutMs <= 0) throw new Error('TIMEOUT');
            let timer: NodeJS.Timeout | undefined;
            try {
              return await Promise.race([
                resolver(hostname),
                new Promise<never>((_resolve, reject) => {
                  timer = setTimeout(() => reject(new Error('TIMEOUT')), Math.max(1, Math.ceil(timeoutMs)));
                  timer.unref?.();
                }),
              ]);
            } finally {
              if (timer) clearTimeout(timer);
            }
          }

          export async function resolveSafeTarget(raw: string | URL, resolver: Resolver = systemResolver, timeoutMs?: number): Promise<SafeTarget> {
          """
          if text.count(anchor) != 1: raise SystemExit('policy.ts: resolveSafeTarget anchor mismatch')
          text = text.replace(anchor, helper, 1)
          old = "  try { addresses = await resolver(url.hostname); } catch { throw new Error('DNS_FAILURE'); }"
          new = "  try { addresses = await resolveWithTimeout(url.hostname, resolver, timeoutMs); } catch (error) { if (error instanceof Error && error.message === 'TIMEOUT') throw error; throw new Error('DNS_FAILURE'); }"
          if text.count(old) != 1: raise SystemExit('policy.ts: resolver await anchor mismatch')
          text = text.replace(old, new, 1)
          old = "  try { current = await resolveSafeTarget(rawUrl, resolver); }\n  catch (error) {\n    const code = error instanceof Error ? error.message : 'URL_INVALID';\n    if (code === 'DNS_FAILURE') return failure(submissionId, start, 0, 'UNAVAILABLE', 'DNS_FAILURE');"
          new = "  try { current = await resolveSafeTarget(rawUrl, resolver, TOTAL_TIMEOUT_MS); }\n  catch (error) {\n    const code = error instanceof Error ? error.message : 'URL_INVALID';\n    if (code === 'TIMEOUT') return failure(submissionId, start, 0, 'UNAVAILABLE', 'TIMEOUT');\n    if (code === 'DNS_FAILURE') return failure(submissionId, start, 0, 'UNAVAILABLE', 'DNS_FAILURE');"
          if text.count(old) != 1: raise SystemExit('policy.ts: initial resolve anchor mismatch')
          text = text.replace(old, new, 1)
          old = "      try { current = await resolveSafeTarget(next, resolver); }\n      catch (error) {\n        const code = error instanceof Error ? error.message : 'URL_INVALID';\n        if (code === 'DNS_FAILURE') return failure(submissionId, start, redirects + 1, 'UNAVAILABLE', 'DNS_FAILURE');"
          new = "      const remainingForDns = TOTAL_TIMEOUT_MS - (performance.now() - start);\n      if (remainingForDns <= 0) return failure(submissionId, start, redirects + 1, 'UNAVAILABLE', 'TIMEOUT');\n      try { current = await resolveSafeTarget(next, resolver, remainingForDns); }\n      catch (error) {\n        const code = error instanceof Error ? error.message : 'URL_INVALID';\n        if (code === 'TIMEOUT') return failure(submissionId, start, redirects + 1, 'UNAVAILABLE', 'TIMEOUT');\n        if (code === 'DNS_FAILURE') return failure(submissionId, start, redirects + 1, 'UNAVAILABLE', 'DNS_FAILURE');"
          if text.count(old) != 1: raise SystemExit('policy.ts: redirect resolve anchor mismatch')
          policy.write_text(text.replace(old, new, 1))

          replace_once(
