              const result = await runOneJob(db, {shipVerifierClient: {verify: async ({submissionId}) => ({schema_version: 'ship-verifier.observation.v1', submission_id: submissionId, outcome: 'PASS', reason_code: 'PUBLIC_HTTPS_OK', final_url: `https://cdn.example/object?${secret}`, http_status: 200, duration_ms: 8, redirects: 1})}});
              assert.equal(result.status, 'succeeded');
              const encoded = JSON.stringify(await getProjectShipState(db, f.projectId));
