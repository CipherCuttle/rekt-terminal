          text = artifact.read_text()
          anchor = """interface ShipReceiptAttributionTable {
            receipt_id: string;
            player_id: string;
            display_name: string;
            role: 'OWNER' | 'PARTY';
            assist_id: string | null;
            accepted_at: Date | null;
            snapshotted_at: Generated<Date>;
          }

          type ArtifactDatabaseSchema = DatabaseSchema & {
          """
          replacement = """interface ShipReceiptAttributionTable {
            receipt_id: string;
            player_id: string;
            display_name: string;
            role: 'OWNER' | 'PARTY';
            assist_id: string | null;
