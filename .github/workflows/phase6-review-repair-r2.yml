          new = """    assert.equal(artifact.assists.length, 2);
              assert.deepEqual(new Set(artifact.assists.map((row) => row.assist_id)), new Set([acceptedAssistId, secondAcceptedAssistId]));
              assert.equal(artifact.assists.every((row) => row.player_id === acceptedHelper.playerId), true);
              assert.equal(artifact.assists.every((row) => row.source_state === 'ACCEPTED'), true);
          """
          if text.count(old) != 1: raise SystemExit('artifact test: assist assertion anchor mismatch')
          text = text.replace(old, new, 1)
          text = text.replace("const lateAssistId = await offerAssist(app, lateHelper.cookie, beaconId, 'accepted after Ship');", "const lateAssistId = await offerAssist(app, lateHelper.cookie, secondBeaconId, 'accepted after Ship');")
          old = """    const snapshotBeforeLate = await db.selectFrom('ship_receipt_attributions').selectAll().where('receipt_id', '=', artifact.receipt_id).orderBy('role', 'asc').orderBy('player_id', 'asc').execute();
              assert.equal(snapshotBeforeLate.length, 2);
          """
          new = """    const snapshotBeforeLate = await db.selectFrom('ship_receipt_attributions').selectAll().where('receipt_id', '=', artifact.receipt_id).orderBy('role', 'asc').orderBy('player_id', 'asc').execute();
              assert.equal(snapshotBeforeLate.length, 2);
              const assistsBeforeLate = await db.selectFrom('ship_receipt_assists').selectAll().where('receipt_id', '=', artifact.receipt_id).orderBy('accepted_at', 'asc').orderBy('assist_id', 'asc').execute();
              assert.equal(assistsBeforeLate.length, 2);
          """
          if text.count(old) != 1: raise SystemExit('artifact test: snapshot anchor mismatch')
          text = text.replace(old, new, 1)
          old = """    const snapshotAfterReplay = await db.selectFrom('ship_receipt_attributions').selectAll().where('receipt_id', '=', artifact.receipt_id).orderBy('role', 'asc').orderBy('player_id', 'asc').execute();
              assert.deepEqual(snapshotAfterReplay, snapshotBeforeLate);
          """
          new = """    const snapshotAfterReplay = await db.selectFrom('ship_receipt_attributions').selectAll().where('receipt_id', '=', artifact.receipt_id).orderBy('role', 'asc').orderBy('player_id', 'asc').execute();
              assert.deepEqual(snapshotAfterReplay, snapshotBeforeLate);
              const assistsAfterReplay = await db.selectFrom('ship_receipt_assists').selectAll().where('receipt_id', '=', artifact.receipt_id).orderBy('accepted_at', 'asc').orderBy('assist_id', 'asc').execute();
              assert.deepEqual(assistsAfterReplay, assistsBeforeLate);
          """
          if text.count(old) != 1: raise SystemExit('artifact test: replay anchor mismatch')
          test_path.write_text(text.replace(old, new, 1))
          PY

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify isolated verifier
        run: |
          npm run typecheck -w @rekt-ink/inkubator-verifier
          npm run test -w @rekt-ink/inkubator-verifier

      - name: Verify API contract and generated client
        run: |
          npm run typecheck -w @rekt-ink/inkubator-api
          npm run build -w @rekt-ink/inkubator-api
          npm run generate:client -w @rekt-ink/inkubator-api
          npm run verify:client -w @rekt-ink/inkubator-api
          npm run test -w @rekt-ink/inkubator-api
          npm run test -w @rekt-ink/inkubator-protocol
          npm run build -w @rekt-ink/inkubator-lab

      - name: Apply migrations
        run: npm run migrate -w @rekt-ink/inkubator-api

      - name: Focused Phase 6 review falsification
        run: >-
          timeout 180s node --test --test-concurrency=1
          apps/inkubator-api/test/integration/phase6-review-repair.test.mjs
          apps/inkubator-api/test/integration/phase6-ship-artifact-attribution.test.mjs
          apps/inkubator-api/test/integration/phase6-ship-acceptance-receipt.test.mjs
          apps/inkubator-api/test/integration/phase6-ship-unavailable-truth.test.mjs
          apps/inkubator-api/test/integration/phase6-ship-reconciliation-starvation.test.mjs

      - name: Full Postgres integration
        run: timeout 300s npm run test:integration -w @rekt-ink/inkubator-api

      - name: Publish verified product-only repair and remove harnesses
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase6-review-repair.yml .github/workflows/phase6-review-repair-r2.yml
          git add \
            apps/inkubator-api/src/ship.ts \
            apps/inkubator-api/src/jobs.ts \
            apps/inkubator-api/src/contract-phase6c.ts \
            apps/inkubator-api/src/migrations.ts \
            apps/inkubator-api/src/migrations/016-phase6-review-repair.ts \
            apps/inkubator-api/src/ship-artifact.ts \
            apps/inkubator-api/test/integration/phase6-review-repair.test.mjs \
            apps/inkubator-api/test/integration/phase6-ship-artifact-attribution.test.mjs \
            apps/inkubator-verifier/src/policy.ts \
            apps/inkubator-verifier/test/policy.test.mjs \
            apps/inkubator-lab/src/generated/inkubator-api-client.ts
          git diff --cached --check
          git config user.name 'phase6-review-repair[bot]'
          git config user.email 'phase6-review-repair[bot]@users.noreply.github.com'
          git commit -m 'fix(inkubator): close final Phase 6 review findings'
          git push origin HEAD:feature/inkubator-ship-verifier-receipt-v0
