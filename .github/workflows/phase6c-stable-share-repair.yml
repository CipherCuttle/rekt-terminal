name: Phase 6C Stable Share Repair

on:
  pull_request:
    paths:
      - '.github/workflows/phase6c-stable-share-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: rekt
          POSTGRES_PASSWORD: rekt_test
          POSTGRES_DB: rekt_inkubator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekt -d rekt_inkubator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rekt:rekt_test@127.0.0.1:5432/rekt_inkubator
      INKUBATOR_APP_ORIGIN: http://127.0.0.1:4175
      INKUBATOR_DEV_AUTH: '1'
      NODE_ENV: test

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply bounded stable receipt-share repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {count}')
              p.write_text(text.replace(old, new, 1))

          ship_artifact = Path('apps/inkubator-api/src/ship-artifact.ts')
          text = ship_artifact.read_text()
          marker = "export async function getAcceptedShipArtifactForSubmission(\n"
          if text.count(marker) != 1:
              raise SystemExit('ship-artifact.ts: unexpected submission lookup shape')
          if 'getAcceptedShipArtifactByReceiptId' in text:
              raise SystemExit('ship-artifact.ts: receipt lookup already exists')
          text += """

          export async function getAcceptedShipArtifactByReceiptId(
            dbInput: Kysely<DatabaseSchema>,
            receiptId: string,
          ) {
            const db = artifactDb(dbInput);
            const receipt = await db.selectFrom('ship_receipts')
              .select('submission_id')
              .where('receipt_id', '=', receiptId)
              .executeTakeFirst();
            if (!receipt) return null;
            return getAcceptedShipArtifactForSubmission(dbInput, receipt.submission_id);
          }
          """
          ship_artifact.write_text(text)

          replace_once(
              'apps/inkubator-api/src/app.ts',
              "import {getProjectShipState, submitShip} from './ship.js';\n",
              "import {getAcceptedShipArtifactByReceiptId} from './ship-artifact.js';\nimport {getProjectShipState, submitShip} from './ship.js';\n",
          )
          route_anchor = "  app.delete('/v1/session', async (request, reply) => {"
          route = """  app.get('/v1/ship-receipts/:receiptId', async (request, reply) => {
            const {receiptId}=request.params as {receiptId:string};
            if(!isUuid(receiptId))return error(reply,400,'invalid_receipt_id');
            const artifact=await getAcceptedShipArtifactByReceiptId(options.db,receiptId);
            if(!artifact)return error(reply,404,'ship_receipt_not_found');
            reply.header('cache-control','public, max-age=31536000, immutable');
            return artifact;
          });

          """
          replace_once('apps/inkubator-api/src/app.ts', route_anchor, route + route_anchor)

          contract = Path('apps/inkubator-api/src/contract-phase6c.ts')
          text = contract.read_text()
          anchor = "paths['/v1/projects/{projectId}/ship'].get.responses['200'].description = 'Privacy-safe public Ship state with immutable accepted Artifact attribution when PROVEN';\n"
          if text.count(anchor) != 1:
              raise SystemExit('contract-phase6c.ts: unexpected Project Ship path shape')
          addition = anchor + """paths['/v1/ship-receipts/{receiptId}'] = {
            get: {
              operationId: 'getShipReceipt',
              parameters: [{name: 'receiptId', in: 'path', required: true, schema: {type: 'string', format: 'uuid'}}],
              responses: {
                '200': {description: 'Stable privacy-safe accepted Ship Artifact permalink', content: {'application/json': {schema: {$ref: '#/components/schemas/AcceptedShipArtifactView'}}}},
                '400': {description: 'Invalid receipt ID', content: {'application/json': {schema: {$ref: '#/components/schemas/Error'}}}},
                '404': {description: 'Accepted Ship Receipt not found', content: {'application/json': {schema: {$ref: '#/components/schemas/Error'}}}},
              },
            },
          };
          """
          contract.write_text(text.replace(anchor, addition, 1))

          test_path = Path('apps/inkubator-api/test/integration/phase6-ship-artifact-attribution.test.mjs')
          text = test_path.read_text()
          test_anchor = "test('Phase 6C snapshots accepted Party/Assist attribution and exposes a privacy-safe PROVEN Artifact state', async () => {"
          if text.count(test_anchor) != 1:
              raise SystemExit('Phase 6C test anchor not unique')
          helper = """async function publicReceipt(app, receiptId) {
            return app.inject({method: 'GET', url: `/v1/ship-receipts/${receiptId}`});
          }

          """
          text = text.replace(test_anchor, helper + test_anchor, 1)
          snapshot_anchor = "    const snapshotBeforeLate = await db.selectFrom('ship_receipt_attributions')"
          if text.count(snapshot_anchor) != 1:
              raise SystemExit('Phase 6C snapshot anchor not unique')
          stable_checks = """    const stableReceipt = await publicReceipt(app, artifact.receipt_id);
            assert.equal(stableReceipt.statusCode, 200);
            assert.equal(stableReceipt.headers['cache-control'], 'public, max-age=31536000, immutable');
            assert.deepEqual(stableReceipt.json(), artifact);
            assert.equal(JSON.stringify(stableReceipt.json()).includes(privateMarker), false);
            assert.equal(JSON.stringify(stableReceipt.json()).includes(reviewMarker), false);
            assert.equal((await publicReceipt(app, 'not-a-uuid')).statusCode, 400);
            assert.equal((await publicReceipt(app, randomUUID())).statusCode, 404);

          """
          text = text.replace(snapshot_anchor, stable_checks + snapshot_anchor, 1)
          replay_anchor = "    const replay = await operatorReviewShipAcceptance(db, submissionId, {requestId, decision: 'ACCEPT', reason: reviewMarker});"
          if text.count(replay_anchor) != 1:
              raise SystemExit('Phase 6C replay anchor not unique')
          late_checks = """    const stableAfterLatePartyChange = await publicReceipt(app, artifact.receipt_id);
            assert.equal(stableAfterLatePartyChange.statusCode, 200);
            assert.deepEqual(stableAfterLatePartyChange.json(), artifact);

          """
          test_path.write_text(text.replace(replay_anchor, late_checks + replay_anchor, 1))
          PY

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and regenerate exact client
        run: |
          npm run typecheck -w @rekt-ink/inkubator-api
          npm run build -w @rekt-ink/inkubator-api
          npm run generate:client -w @rekt-ink/inkubator-api
          npm run verify:client -w @rekt-ink/inkubator-api
          grep -q 'getShipReceipt' apps/inkubator-lab/src/generated/inkubator-api-client.ts

      - name: Unit protocol and Artifact gates
        run: |
          npm run test -w @rekt-ink/inkubator-api
          npm run test -w @rekt-ink/inkubator-protocol
          npm run test -w @rekt-ink/inkubator-lab -- --run src/signal-system/GoldenScreens.test.tsx
          npm run build -w @rekt-ink/inkubator-lab

      - name: Apply migrations
        run: npm run migrate -w @rekt-ink/inkubator-api

      - name: Focused Phase 6 falsification
        run: >-
          timeout 120s node --test --test-concurrency=1
          apps/inkubator-api/test/integration/phase6-ship-artifact-attribution.test.mjs
          apps/inkubator-api/test/integration/phase6-ship-acceptance-receipt.test.mjs
          apps/inkubator-api/test/integration/phase6-ship-unavailable-truth.test.mjs
          apps/inkubator-api/test/integration/phase6-ship-reconciliation-starvation.test.mjs

      - name: Full Postgres integration
        run: timeout 240s npm run test:integration -w @rekt-ink/inkubator-api

      - name: Publish verified product-only repair and remove harness
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase6c-stable-share-repair.yml
          git add \
            apps/inkubator-api/src/app.ts \
            apps/inkubator-api/src/contract-phase6c.ts \
            apps/inkubator-api/src/ship-artifact.ts \
            apps/inkubator-api/test/integration/phase6-ship-artifact-attribution.test.mjs \
            apps/inkubator-lab/src/generated/inkubator-api-client.ts
          git diff --cached --check
          git config user.name 'phase6c-verifier[bot]'
          git config user.email 'phase6c-verifier[bot]@users.noreply.github.com'
          git commit -m 'fix(inkubator): add stable accepted Ship receipt permalink'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
