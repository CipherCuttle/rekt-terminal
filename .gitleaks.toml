title = "rekt-terminal secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Narrow public EVM contract-address evidence plus one docs-only Stage-H closure commit known to contain a public Git SHA, not a credential."
regexTarget = "line"
commits = [
  "2a0a4c50831508d88364574bc9ead0c72b4cbab8"
]
regexes = [
  '''^\s*"baseTokenAddress"\s*:\s*"0x[a-fA-F0-9]{40}",?\s*$''',
  '''^\s*- synthetic token:\s*`0x[a-fA-F0-9]{40}`;?\s*$'''
]
