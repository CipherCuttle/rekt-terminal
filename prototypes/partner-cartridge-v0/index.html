<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REKT Inkubator // Partner Cartridge V0</title><style>
:root{--bg:#07070a;--line:#30303a;--muted:#858596;--text:#f0eef7;--acid:#b9ff38;--apple:#ff4d57}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#25163f 0,#09090d 38%,#050507 75%);color:var(--text);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh}.machine{max-width:1120px;margin:28px auto;padding:14px;border:1px solid #34313d;border-radius:18px;background:rgba(8,8,12,.92);box-shadow:0 30px 100px #000}.top{display:flex;justify-content:space-between;gap:12px;padding:10px 12px 18px;border-bottom:1px solid var(--line);letter-spacing:.08em}.brand{font-weight:800}.truth{color:var(--muted)}.lamp{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acid);box-shadow:0 0 12px var(--acid);margin-right:8px}.screen{min-height:650px;padding:28px;position:relative;overflow:hidden}.scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.018) 4px)}.kicker{color:var(--acid);letter-spacing:.14em;font-size:11px;margin-bottom:10px}.h1{font-size:clamp(28px,5vw,62px);line-height:.9;font-weight:900;letter-spacing:-.06em;max-width:900px;margin:0 0 18px}.sub{max-width:680px;color:#aaa7b4;font-size:14px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:26px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(20,19,27,.9),rgba(10,10,14,.9));border-radius:12px;padding:18px;position:relative}.cartridge{border-color:#5d3340;cursor:pointer;transition:.18s}.cartridge:hover{transform:translateY(-2px);border-color:var(--apple)}.apple{color:var(--apple);font-weight:900}.row{display:flex;justify-content:space-between;gap:16px;border-top:1px solid #272630;padding:10px 0}.row:first-of-type{border-top:0}.muted{color:var(--muted)}button{font:inherit;color:#09090b;background:var(--acid);border:0;border-radius:7px;padding:10px 14px;font-weight:900;cursor:pointer}button.ghost{background:#1c1923;color:#ddd;border:1px solid #393442}button.applebtn{background:var(--apple);color:#fff}.bites{display:grid;gap:9px;margin-top:18px}.bite{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:14px;border:1px solid #302e39;border-radius:9px;padding:13px}.bite strong{display:block}.thread{margin:25px 0 8px;display:flex;align-items:center;gap:0;overflow:auto}.node{min-width:100px;text-align:center;color:#a6a3ae}.node:before{content:"";display:block;width:9px;height:9px;border:2px solid #55515e;border-radius:50%;margin:0 auto 7px;background:#111}.node.done:before{background:var(--acid);border-color:var(--acid);box-shadow:0 0 10px rgba(185,255,56,.4)}.rail{height:1px;background:#494550;min-width:55px;flex:1}.next{border-left:3px solid var(--acid);padding:15px 17px;background:#11120e;margin-top:20px}.receipt{border:1px solid #667a40;background:#0d1109;padding:20px;border-radius:10px}.stamp{color:var(--acid);font-size:28px;font-weight:900}.embed{max-width:480px;border:1px solid #483b5c;background:#0b0910;padding:16px;border-radius:10px;box-shadow:0 10px 40px #000}.embedhead{font-weight:900;margin-bottom:12px}.footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:12px;color:#74717e;font-size:11px}@media(max-width:760px){.machine{margin:0;border-radius:0;min-height:100vh}.screen{padding:20px}.grid{grid-template-columns:1fr}.bite{grid-template-columns:65px 1fr}.bite button{grid-column:1/-1}.top{font-size:10px}}
</style></head><body><div class="machine"><div class="top"><div class="brand"><span class="lamp"></span>REKT INKUBATOR // PARTNER CARTRIDGE V0</div><div class="truth">PROTOTYPE · NO REAL TRANSACTIONS</div></div><main class="screen" id="screen"></main><div class="footer"><span>CLAIMED ≠ OBSERVED ≠ PROVEN</span><span id="step">WORLD</span></div></div><script>

function build(){state.mission=true;set('COMMAND',`<div class="kicker">COMMAND // MISSION DECLARED</div><h1 class="h1">AI REWARD RADAR</h1><div class="card"><div class="row"><span>ORIGIN</span><strong class="apple">🍎 APPLE INU // BITE-001</strong></div><div class="row"><span>TRUTH</span><span>CLAIMED</span></div><div class="row"><span>SHIP CONDITION</span><span class="muted">Working public artifact consuming real Ink state.</span></div></div><div class="thread"><div class="node done">DECLARE</div><div class="rail"></div><div class="node done">BUILD</div><div class="rail"></div><div class="node">OBSERVE</div><div class="rail"></div><div class="node">TEST</div><div class="rail"></div><div class="node">SHIP</div></div><div class="next"><div class="kicker">NEXT MOVE</div><strong>READ AND DISPLAY ONE BOUNDED APPLE INU PRIMITIVE.</strong></div><p><button onclick="evidence()">SIMULATE REAL WORK OBSERVED →</button></p>`)}

function ship(){state.shipped=true;set('SHIP RECEIPT',`<div class="kicker">ARTIFACT // ACCEPTED</div><div class="receipt"><div class="stamp">✓ PROVEN</div><h1>AI REWARD RADAR</h1><div class="row"><span>BUILT FOR</span><strong class="apple">🍎 APPLE INU</strong></div><div class="row"><span>BUILD SIGNAL</span><strong>BITE-001</strong></div><div class="row"><span>ORIGIN</span><span>IMMUTABLE MISSION.DECLARED HISTORY</span></div><div class="row"><span>SHIP AUTHORITY</span><strong>INKUBATOR</strong></div></div><p><button onclick="embed()">SEE THE LOOP CLOSE →</button></p>`)}
function embed(){set('RECIPROCAL EMBED',`<div class="kicker">APPLEINU.COM // SAFE EMBED PREVIEW</div><h1 class="h1">THE RESULT FLOWS BACK.</h1><div class="embed"><div class="embedhead">BUILT WITH REKT INKUBATOR</div><div class="row"><span>● BUILDERS ACTIVE</span><strong>0</strong></div><div class="row"><span>◆ OPEN BITES</span><strong>3</strong></div><div class="row"><span>✓ SHIPPED</span><strong>1</strong></div><div class="row"><span>NEW</span><span>AI Reward Radar // BITE-001</span></div><br><button onclick="world()">ENTER THE INKUBATOR →</button></div><div class="next"><div class="kicker">LOOP</div>PARTNER NEED → MISSION → WORK → EVIDENCE → SHIP → PARTNER WORLD CHANGES → NEW NEED</div>`)}world();
</script></body></html>
